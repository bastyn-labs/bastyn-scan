# Bastyn rule corpus.
#
# "Say less, be right." Every rule here is verified against a real fixture
# pair in tests/fixtures/{vulnerable_agent,clean_agent} and against the
# ast-grep patterns directly in crates/bastyn-core/tests/rule_patterns.rs.
# A pattern that cannot be made precise is not in this file — see that test
# file's module docs for the ones that were tried and dropped.
#
# Schema: id, title, kind (defect|observation), severity, confidence,
# categories (from bastyn_core::category::Category), language, in_test_paths
# (optional, downgrade|report, default downgrade), any (required, non-empty),
# none (optional exclusions matched against the same node), inside (optional
# ancestor constraint), metavariable_matches (optional per-capture regex),
# description, remediation.
#
# `in_test_paths` exists because of a measurement: scanning 65 real
# third-party AI repositories on 2026-08-28, BAS-ZT1-002 produced 32 findings
# and 23 of them (72%) were placeholder DSNs in test fixtures — the single
# largest measured source of false positives in this rule set. A match in a
# test path (see crates/bastyn-core/src/test_path.rs for what counts) is
# therefore reported as an observation rather than a defect by default: out of
# the default report, still there under --show-observations, so a genuinely
# leaked secret that happens to live in a fixture is never silently dropped.
# A rule says `in_test_paths: report` when its finding is worth reading even
# in a fixture.

rules:
  # ---------------------------------------------------------------------
  # LLM10 — Improper Output Handling. The highest-value category: running,
  # querying, or shelling out with model output is always wrong, in every
  # deployment. Never context-dependent, which is why it leads the file.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-001
    title: Model output executed as code
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10, ZT4]
    language: python
    any:
      - eval($ARG)
      - exec($ARG)
    none:
      - eval("$LIT")
    # Migrated off `metavariable_matches` on 2026-08-28. The gate this
    # replaces was ARG matching
    # `(?i)(response|reply|completion|message|content|choices|output|generated)`
    # -- a guess about what the author called the variable, not a fact about
    # where its value came from. Measured by
    # crates/bastyn-core/tests/brittleness_gate.rs, that gate caught 0 of 10
    # realistic alternative namings of the identical bug (`suggestion`,
    # `statement`, `expression`, `code`, ...) and it caught the one real
    # corpus finding it ever produced by accident, because the subscript
    # happened to read `r['Messages']`.
    #
    # `flow:` asks the question the rule title actually claims to answer:
    # did this value come out of a model. `unguarded: true` drops the match
    # when a check against a fixed set already dominates the call, and
    # `sink: code_execution` extends the same test one call outwards, to a
    # local function that forwards the value into eval/exec -- a shape no
    # `any:` pattern can describe, because the call site names that function
    # rather than eval.
    #
    # `builtin_callee: true` drops a call through a name this file rebinds
    # (a local `def eval`), which is not the builtin. BAS-LLM10-004 (below)
    # reports eval()/exec() on any non-literal unconditionally, without this
    # rule's `source: model_output` gate or its `sink: code_execution`
    # wrapper-forwarding reach -- the two rules stay distinct because this one
    # additionally follows the value one call outward through a local
    # wrapper, which BAS-LLM10-004 does not attempt.
    flow:
      variable: ARG
      source: model_output
      unguarded: true
      sink: code_execution
      builtin_callee: true
    description: >
      A value that came from a model call is executed as Python, either
      directly by eval()/exec() or by a function in this file that passes it
      straight through to one. A model reply is untrusted input; running it is
      arbitrary remote code execution the moment an attacker can influence
      what the model says.
    remediation: >
      Never execute model output. If the agent needs to run model-suggested
      logic, parse it into a constrained, whitelisted set of operations (a
      small interpreter or a JSON tool-call schema) instead of eval/exec.

  - id: BAS-LLM10-002
    title: Model output executed as a shell command
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - os.system($ARG)
      - subprocess.run($ARG, shell=True)
      - subprocess.call($ARG, shell=True)
      - subprocess.Popen($ARG, shell=True)
    # A defect only when the value traces back to a model call. When the
    # flow graph cannot trace it (a function parameter, a name bound
    # elsewhere), a model-reply-shaped name is still worth a look, so it is
    # reported as an observation instead of dropped.
    flow:
      variable: ARG
      source: model_output
      unguarded: true
      unproven:
        kind: observation
        requires:
          ARG: "(?i)(response|reply|completion|message|content|choices|output|generated)"
    description: >
      A value that may carry a model reply is passed to a shell with
      shell=True (or os.system). If it does, anything the model was tricked
      into saying -- including output planted by content it read from the
      web or from a document -- runs as a shell command with the process's
      full privileges.
    remediation: >
      Do not derive shell commands from model output. If the agent must run a
      fixed set of commands, dispatch on a whitelist of command names with
      argv-array subprocess calls (shell=False) and validated arguments —
      never format model text into a command string.

  # Measured 2026-08-28 against 65 real third-party repositories: this rule
  # produced 5 findings, all false positives, all one of two shapes --
  # neither an attacker can influence:
  #
  # 1. A bare string-literal argument (single/double/triple-quoted, possibly
  #    wrapped in one call like SQLAlchemy's `text(...)`, possibly spread
  #    across several adjacent literals Python concatenates implicitly --
  #    `"a" "b"` with no operator between them) that merely happens to
  #    *contain* one of the ARG trigger words as SQL, e.g. `output_redacted
  #    TEXT` or `error_message TEXT` inside a `CREATE TABLE` DDL string. No
  #    interpolation syntax (an f-string, `.format()`, `%`, or `+`) is
  #    present, so there is nothing for an attacker to reach.
  # 2. A SQLAlchemy query-builder expression (`update(...)`, `select(...)`,
  #    `insert(...)`) passed to `.execute()`. These build a parameterized
  #    query object, not a SQL string -- a `message`/`response`-named value
  #    passed to `.values()` becomes a bound parameter, never query text.
  #
  # The `none:` entries below exclude shape 1's triple-quoted and
  # `$FN(...)`-wrapped forms; an f-string structurally differs from a plain
  # string node (it carries interpolation children) so `"$LIT"` does not
  # accidentally swallow it -- verified directly against the
  # vulnerable_agent/llm10_eval_on_model_reply fixtures, both of which stay
  # caught. `metavariable_not_matches` excludes shape 2 by requiring ARG not
  # *start* with one of the three builder calls -- anchored so it cannot
  # misfire on an identifier like `select_summary`. None of `none:`'s
  # alternate-shape matching can express "starts with X" across an
  # arbitrary method chain (`update(t).where(...).values(...)`), which is
  # why this rule alone needs both mechanisms.
  #
  # The single- and double-quoted plain-literal forms of shape 1, including
  # any number of adjacent literals Python concatenates implicitly, are
  # excluded through `metavariable_not_matches` instead of enumerated
  # `none:` shapes. First shipped as `none:` entries capped at 2-5 adjacent
  # literals (the corpus example at the time needed 4), which is exactly
  # the boundary a second corpus run (2026-08-31) fell outside: a
  # `LiteLLM_SpendLogs` audit query split across more than 5 line-wrapped
  # literals, one of which contains the column name `completion_tokens` --
  # "completion" being an ARG trigger word for an entirely unrelated
  # reason, and whose last segment switches from double to single quotes
  # to hold a double-quoted identifier without escaping it. The
  # replacement regex anchors end-to-end ("the whole argument is nothing
  # but one or more quoted-literal segments, each independently either
  # single- or double-quoted") so it holds for any count and any mix of
  # quote styles, not just the ones a corpus run happened to produce.
  #
  # Two alternatives to the literal exclusions below were tried and rejected, both refuted by a scan
  # against `rules::tests::bas_llm10_003_still_flags_percent_interpolation`
  # /`_still_flags_a_format_call` before shipping:
  #   - An ast-grep `$$$` ellipsis `none:` pattern (`$CUR.execute("$A"
  #     $$$REST)`) does generalize to any literal count, but does not
  #     scope cleanly to sibling literal-string nodes: it also absorbed
  #     `"...%s..." % response`, silently suppressing a real percent-
  #     interpolation SQL injection.
  #   - The rule now asks the flow graph, as BAS-LLM10-001 does. A call to
  #     .format on a string literal carries its arguments' provenance, so
  #     `"...".format(response)` stays provable. When the origin cannot be
  #     traced, the old ARG name list decides whether it is reported as an
  #     observation.
  - id: BAS-LLM10-003
    title: Model output concatenated into a SQL query
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - $CUR.execute($ARG)
    none:
      - $CUR.execute("""$LIT""")
      - $CUR.execute('''$LIT''')
      - $CUR.execute($FN("$LIT"))
      - $CUR.execute($FN('$LIT'))
      - $CUR.execute($FN("""$LIT"""))
      - $CUR.execute($FN('''$LIT'''))
    metavariable_matches:
      CUR: "(?i)(cursor|cur|db|conn|connection)"
    metavariable_not_matches:
      ARG: '^\s*(select|insert|update)\(|^\s*(("([^"\\]|\\.)*")|(''([^''\\]|\\.)*''))(\s*(("([^"\\]|\\.)*")|(''([^''\\]|\\.)*'')))*\s*$'
    flow:
      variable: ARG
      source: model_output
      unguarded: true
      unproven:
        kind: observation
        requires:
          ARG: "(?i)(response|reply|completion|message|content|choices|output|generated)"
    description: >
      A database cursor executes a query built from a value that may carry a
      model reply. If it does, this is SQL injection with the model as the
      delivery mechanism: the model's reply is attacker-influenceable via
      prompt injection from any untrusted document, tool result, or user
      message it has seen.
    remediation: >
      Never interpolate model output into a SQL string. Use parameterized
      queries (cursor.execute(sql, params)) and keep model output confined to
      parameter values, never to the query text itself.

  # ---------------------------------------------------------------------
  # LLM10 — the same SQL-injection shape as BAS-LLM10-003 above, but with
  # the taint passing through one local variable first:
  #
  #   sql = f"SELECT id, title, body FROM kb_articles WHERE title LIKE
  #   '%{query}%'"
  #   cursor.execute(sql)
  #
  # BAS-LLM10-003 used to be a pure structural pattern gated by
  # `metavariable_matches` on $CUR's and $ARG's own *text*. When the
  # tainted value was assigned to a local variable first and that variable
  # -- not the f-string itself -- was what reached `.execute()`, $ARG's
  # captured text was just `sql`: no response/reply/... trigger word
  # appeared anywhere in it, so the name-gate could never see it. `none:`
  # only rules out alternate shapes of the matched node itself, and
  # `inside:` only reaches its ancestors -- neither can look at a prior
  # sibling assignment, which is exactly where the SQL string was actually
  # built.
  #
  # Confirmed directly against this codebase's flow graph
  # (crates/bastyn-core/src/flow/), unmodified: `Analyzer::compute`'s
  # `"string"` match arm already treats an f-string as carrying whatever
  # its `{...}` interpolations carry, and its `"identifier"` case already
  # resolves a name back through its local binding's assigned expression --
  # so resolving the origin of `sql` in the example above returns
  # `Origin::Call { callee: "client.chat.completions.create" }`, with no
  # engine changes needed. This rule asks the flow graph that question
  # directly -- no `metavariable_matches` on $ARG here -- the same way
  # BAS-LLM10-001 already asks it for eval()/exec(); the flow gate's proof
  # of provenance does the precision work a name guess only approximates.
  #
  # Both rules now consult the flow graph, so their coverage overlaps
  # wherever a value's provenance alone proves the finding, not just on the
  # direct single-line case. When they match the identical node this
  # codebase's `merge_same_location` (in crates/bastyn-core/src/rules/
  # engine.rs) collapses that into one cross-layer finding rather than
  # reporting a duplicate -- existing, relied-upon behaviour, not something
  # new this rule has to handle.
  #
  # Known gap, not oversold: this rule does not catch the value when it
  # arrives as a plain function parameter with no traceable in-file call to
  # a catalogued source -- e.g. an MCP tool function's own `query: str`
  # parameter, which is conceptually agent-controlled once you know it is a
  # tool handler, but resolves to `Origin::Parameter` in the flow graph,
  # not `Origin::Call{...}`, and so cannot classify as `model_output` no
  # matter what it is named. Catching that would need a new `SourceKind`
  # plus a decorator-recognition pass treating a tool function's parameters
  # as tainted -- separate, larger engine work, not attempted here. See
  # tests/corpus/vulnerable/real_misses/sql_from_tool_parameter.py and its
  # `known_gap` entry in tests/corpus/expected.toml.
  # ---------------------------------------------------------------------
  - id: BAS-LLM10-008
    title: Model output reaches SQL through a local variable
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - $CUR.execute($ARG)
    # Unlike BAS-LLM10-001's ARG gate, this is not a name guess this rule can
    # afford to drop: `.execute()` is not SQL-specific by itself -- a
    # GraphQL client, a task queue, or a workflow engine can all expose an
    # `.execute()` method, and METHOD_SINKS's own doc comment in
    # crates/bastyn-core/src/flow/catalogue.rs already notes ".execute is
    # DB-API's" as a convention this file relies on, not a guarantee the
    # flow graph enforces on this rule's behalf (the `flow:` clause here has
    # no `sink:`, so nothing checks that the receiver is actually a DB
    # cursor). Keeping BAS-LLM10-003's CUR gate is what keeps this rule from
    # mislabeling `gql_client.execute(model_reply)` as SQL injection.
    metavariable_matches:
      CUR: "(?i)(cursor|cur|db|conn|connection)"
    flow:
      variable: ARG
      source: model_output
    description: >
      A database cursor executes a query built from a local variable whose
      value traces back, through the flow graph, to a model call -- most
      commonly one local f-string reassignment between the model reply and
      the execute() call (sql = f"...{response}..."; cursor.execute(sql)).
      Since the model's reply is attacker-influenceable (via prompt
      injection from any untrusted document, tool result, or user message
      it has seen), this is SQL injection with the model as the delivery
      mechanism, exactly as BAS-LLM10-003 catches for the direct,
      single-expression case -- this rule catches it when a local variable
      sits in between.
    remediation: >
      Never interpolate model output into a SQL string, whether directly or
      through an intermediate variable. Use parameterized queries
      (cursor.execute(sql, params)) and keep model output confined to
      parameter values, never to the query text itself.

  # ---------------------------------------------------------------------
  # LLM10 — a non-literal command reaches a shell, independent of any
  # check that precedes it. BAS-LLM10-002 only fires when the argument's
  # own text names a response/reply/... variable (a model-output gate);
  # this rule drops that requirement entirely, the same way BAS-LLM10-004
  # dropped it for eval()/exec(). A shell interprets the *whole* command
  # string, so a check on only the first whitespace-split token
  # (allowlist) or on a short substring list (denylist) leaves the rest
  # of the string open to injection — this rule reports the composition
  # itself, not the absence of a check, so a bypassable check does not
  # suppress it. Matches docs/rule-catalogue.md's LLM10.12.
  #
  # 2026-09-28: a value returned by tempfile.mkdtemp/gettempdir/mkstemp/
  # TemporaryDirectory is closed -- excluded by exclude_if: closed_value --
  # when the call takes no arguments, or every argument it does take is
  # itself already safe. The operating system generates the path end to
  # end in the no-argument case (tar -xzf archive.tar.gz -C
  # tempfile.mkdtemp() is not attacker-controlled), but every one of these
  # functions also accepts a caller-supplied prefix/suffix/dir keyword
  # argument that lands directly in the returned path --
  # tempfile.mkdtemp(prefix=user_supplied) is a real shell-injection
  # payload waiting in the prefix, so the callee name alone is not enough;
  # every argument passed must itself already be safe. See
  # tests/corpus/vulnerable/llm10_shell_injection_tool.py's unpack() (a
  # tempfile value mixed with a real parameter, still fires) and
  # make_workspace() (a tempfile call with a caller-supplied prefix, still
  # fires) for the regression proofs, alongside
  # tests/corpus/clean/tempdir_shell.py for the no-argument case that is
  # correctly excluded.
  #
  # Known false positives, documented rather than papered over:
  #   - a sink inside a function nothing in the file calls still fires when
  #     its command is built from more than a bare parameter (e.g. two
  #     parameters concatenated, or a parameter mixed with a call result) --
  #     this rule still has no whole-program reachability analysis for that
  #     shape. 2026-09-28: the narrower, much more common case where the
  #     command argument is a bare pass-through of the enclosing function's
  #     own parameter (def run_raw_command(command): subprocess.run(command,
  #     shell=True)) is no longer left as a false positive -- see
  #     flow.passthrough_downgrade below. See
  #     tests/corpus/vulnerable/real_misses/shell_command_via_unreachable_function.py
  #     (now an `[[expect]]` observation, not a `known_false_positive`) and
  #     tests/corpus/observations/shell_passthrough_helpers.py.
  #   - a sink reachable only when a module-level boolean constant is
  #     flipped from its shipped value still fires -- this rule has no
  #     constant-propagation or dead-branch analysis, so it cannot prove
  #     a guard like `if SECURE_MODE: return ...` makes the sink below it
  #     unreachable. See
  #     tests/corpus/vulnerable/real_misses/shell_command_behind_disabled_flag.py.
  #
  # Known gaps, documented rather than papered over:
  #   - a module-level dict/list that is genuinely mutated elsewhere in the
  #     file (COMMANDS[name] = cmd) still resolves as permanently
  #     `closed: true` by exclude_if: closed_value, wrongly suppressing a
  #     real finding -- crates/bastyn-core/src/flow/graph.rs's
  #     Analyzer::bind_targets only records a binding for a plain-identifier
  #     assignment target; a subscript target or an attribute-call receiver
  #     both record nothing, so the graph never learns the container was
  #     mutated after its own literal initializer. Tracking mutated
  #     container names through the graph is a materially larger change
  #     than this fix wave's scope. See
  #     tests/corpus/vulnerable/real_misses/shell_command_via_mutated_registry.py.
  #     2026-09-28: the same limitation
  #     applies to flow.passthrough_downgrade's own
  #     path_is_reassigned check below -- its exact-text-match search finds
  #     `hook.command = ...`/`opts["cmd"] = ...` in the same function, but
  #     not a quote-style mismatch (`opts['cmd']` vs `opts["cmd"]`), a
  #     variable subscript key (`opts[k] = ...`), mutation reached only
  #     through a second alias (`h = hook; h.command = ...`), or a
  #     method-based mutation (`opts.update(cmd=...)`, `setattr(hook,
  #     "command", ...)`) -- all of these are the identical
  #     "mutated-container tracking is materially larger than this scope"
  #     gap as the COMMANDS example above, just reached through
  #     `is_provably_bare_passthrough` instead of `exclude_if: closed_value`.
  #     Not fixed for the same reason; not separately fixtured, since
  #     shell_command_via_mutated_registry.py above already documents the
  #     identical class of limitation.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-009
    title: Non-literal command run through a shell, regardless of any allowlist/denylist check
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - os.system($ARG)
      - os.popen($ARG)
      - subprocess.run($ARG, shell=True)
      - subprocess.run($ARG, shell=True, $$$REST)
      - subprocess.call($ARG, shell=True)
      - subprocess.call($ARG, shell=True, $$$REST)
      - subprocess.check_call($ARG, shell=True)
      - subprocess.check_call($ARG, shell=True, $$$REST)
      - subprocess.check_output($ARG, shell=True)
      - subprocess.check_output($ARG, shell=True, $$$REST)
      - subprocess.Popen($ARG, shell=True)
      - subprocess.Popen($ARG, shell=True, $$$REST)
    # Both quote styles are excluded for every sink shape below. Final
    # review on 2026-09-23 found all twelve entries spelled with
    # double-quoted "$LIT" only, so a single-quoted fixed command
    # (subprocess.run('systemctl restart opsbot-worker', shell=True))
    # produced an incorrect finding at this rule's own critical severity.
    # Follows the exact quote-style-coverage precedent BAS-LLM10-017 below
    # already ships ("$LIT", '$LIT', """$LIT""", '''$LIT''').
    none:
      - os.system("$LIT")
      - os.system('$LIT')
      - os.popen("$LIT")
      - os.popen('$LIT')
      - subprocess.run("$LIT", shell=True)
      - subprocess.run('$LIT', shell=True)
      - subprocess.run("$LIT", shell=True, $$$REST)
      - subprocess.run('$LIT', shell=True, $$$REST)
      - subprocess.call("$LIT", shell=True)
      - subprocess.call('$LIT', shell=True)
      - subprocess.call("$LIT", shell=True, $$$REST)
      - subprocess.call('$LIT', shell=True, $$$REST)
      - subprocess.check_call("$LIT", shell=True)
      - subprocess.check_call('$LIT', shell=True)
      - subprocess.check_call("$LIT", shell=True, $$$REST)
      - subprocess.check_call('$LIT', shell=True, $$$REST)
      - subprocess.check_output("$LIT", shell=True)
      - subprocess.check_output('$LIT', shell=True)
      - subprocess.check_output("$LIT", shell=True, $$$REST)
      - subprocess.check_output('$LIT', shell=True, $$$REST)
      - subprocess.Popen("$LIT", shell=True)
      - subprocess.Popen('$LIT', shell=True)
      - subprocess.Popen("$LIT", shell=True, $$$REST)
      - subprocess.Popen('$LIT', shell=True, $$$REST)
    # stdin_dispatch excludes a command whose entire non-literal content
    # traces to an unprocessed sys.stdin read -- the hook/skill-runner
    # control-channel shape (sys.stdin.read(), json.load(sys.stdin),
    # input()), the same trust boundary as argv, not attacker-reachable
    # input. A command that reaches a shell via any other non-literal path
    # still fires; see tests/corpus/vulnerable/shell_command_not_stdin_sourced.py.
    # This is a genuine judgement call, not a settled "always safe" pattern
    # -- kept deliberately narrow: a value that merely also touches stdin
    # somewhere in a longer chain (a network read with a stdin fallback,
    # say) does not qualify.
    #
    # 2026-09-28: added cli_argument to close a false positive on the
    # operator's own command line -- sys.argv, argparse's parse_args()/
    # parse_known_args(), and click/typer command parameters -- the same
    # "handed over the process's own control channel, not attacker-reachable"
    # trust boundary stdin_dispatch already grants a hook's stdin read. Kept
    # exactly as narrow: a command mixing a CLI-argument segment with any
    # other non-literal segment still fires. See
    # tests/corpus/clean/cli_argument_paths.py for the regression proof.
    #
    # 2026-09-28: a .parse_args()/.parse_known_args() call only counts when
    # its receiver actually resolves to a call to argparse.ArgumentParser(...)
    # -- written inline, or reached through a local variable. A
    # Flask-RESTful/flask-restx request parser
    # (reqparse.RequestParser().parse_args()) has the identical method
    # name but parses HTTP request data, not the operator's own command
    # line, and must not be trusted the same way a genuine argparse call
    # is. See
    # tests/corpus/vulnerable/llm10_shell_injection_via_request_parser.py
    # for the regression proof.
    exclude_if:
      variable: ARG
      kind: [closed_value, shell_quoted, stdin_dispatch, cli_argument]
    # 2026-09-28: added flow.passthrough_downgrade. A bare parameter
    # reaching a shell with no other non-literal segment (def run(command):
    # subprocess.run(command, shell=True)) resolves Origin::Parameter, which
    # exclude_if above cannot touch -- none of closed_value/shell_quoted/
    # stdin_dispatch/cli_argument claims anything about a value from an
    # unseen caller. Whether that is a real defect depends on who can call
    # `run`: an @mcp.tool()/@app.route()/do_GET-style entry point hands it an
    # agent- or request-chosen value (still a defect), but a private helper
    # this file itself never wires to such an entry point is reported as an
    # observation instead -- the value is proven to come from a parameter,
    # just not proven to be attacker-reachable. See
    # crate::flow::graph::FlowGraph::is_passthrough_observation_eligible for
    # the full set of conditions and tests/corpus/observations/
    # shell_passthrough_helpers.py /
    # tests/corpus/vulnerable/llm10_shell_passthrough_still_defect.py for the
    # observation-vs-still-a-defect regression pairs. Four conditions all
    # have to hold:
    #
    # 1. The captured value must be a syntactically bare pass-through of a
    #    named function's own parameter -- exactly `p`, `p.attr`, or
    #    `p["key"]` (one level of attribute or subscript access, with a
    #    literal subscript key), optionally reached through one plain local
    #    alias (`command = hook.command` then a use of `command`).
    #    `is_provably_bare_passthrough` proves this directly from the raw
    #    syntax rather than from resolved provenance, because an f-string
    #    that mixes the parameter with fixed text would otherwise resolve
    #    the same provenance as a pure pass-through
    #    (`Prov::combine` treats a literal segment as contributing
    #    nothing, which is correct for constant_path/cli_argument/
    #    stdin_dispatch but wrong for this check). A name qualifies as a
    #    bare root only when it has zero bindings anywhere in the function
    #    (an untouched parameter) or exactly one binding, of a plain
    #    `assignment`, whose own right-hand side is itself provably bare;
    #    any other binding -- a reassignment using the parameter's own name,
    #    a branch-split alias, a `for`/comprehension target, a `with`/
    #    `except`/match-case capture, a `nonlocal`/`global` declaration --
    #    disqualifies the name. `self`/`cls` never qualify as a bare root at
    #    all: state read through them may have been set in a different
    #    method from a real parameter, which this file-local analysis
    #    cannot trace. An attribute/subscript path reassigned in place
    #    anywhere in the function (`hook.command = ...`) also disqualifies
    #    it, by an exact text match against the path.
    # 2. The value must not additionally trace to a catalogued untrusted
    #    source, checked as defense-in-depth (structurally implied by
    #    condition 1 already).
    # 3. The function enclosing the sink call must not itself be a
    #    recognized entry point (an `@mcp.tool()`/`@app.route()`/
    #    `do_GET`-style function, decided directly from that function's own
    #    decorators and name).
    # 4. No entry point in the file may call the enclosing function with any
    #    argument this graph cannot prove is safe -- not only when that
    #    argument traces to the entry point's own parameter list. A route
    #    handler with no function parameter carrying the request at all
    #    (`@app.route(...) def run(): return _exec(request.args["cmd"])`)
    #    and a value assigned from a model call to a local variable
    #    (`@mcp.tool() def run(q): cmd = llm.invoke(q).content; return
    #    _exec(cmd)`) both hand a helper untrusted input without going
    #    through the entry point's own parameters, and both must disqualify
    #    the callee the same way forwarding a parameter directly would.
    #    A call through a bare name or a same-instance
    #    `self.NAME(...)`/`cls.NAME(...)` call is matched; two known,
    #    bounded limits remain and are recorded as known_gap fixtures
    #    rather than chased further:
    #      - a call chain longer than one hop (`run(cmd) -> _outer(cmd) ->
    #        _inner(cmd)`) is invisible to this check, the same
    #        bounded-depth precedent FlowGraph::wrapper_sink_parameters's
    #        own doc comment already accepts on the sink side ("a wrapper
    #        around a wrapper is out of reach by construction, not merely
    #        untested"). See
    #        tests/corpus/vulnerable/real_misses/shell_command_via_chained_tool_forward.py.
    #      - a callee shape other than a direct bare-name call or a
    #        same-instance self/cls-qualified method call -- a thread pool
    #        (`asyncio.to_thread(_exec, cmd)`, `pool.submit(_exec, cmd)`),
    #        an unbound-method call (`Class._exec(self, cmd)`), a `super()`
    #        call (`super()._exec(cmd)`), a decorator registry, indirect
    #        dispatch through a dict of callables, ... -- is also invisible
    #        to it; the space of ways a callable and its argument can be
    #        passed along elsewhere is open-ended, so this is recorded
    #        rather than special-cased indefinitely. See
    #        tests/corpus/vulnerable/real_misses/shell_command_via_thread_pool_forward.py
    #        for one representative shape.
    flow:
      variable: ARG
      passthrough_downgrade: true
    description: >
      A command string that is not a fixed literal reaches a shell
      (subprocess...shell=True, os.system, or os.popen). A shell
      interprets the entire string, so any check narrower than "the
      whole command matches one of a fixed set of literals" — a
      first-token allowlist, a substring denylist — is bypassable. This
      rule reports the composition itself: a non-literal command reaching
      a shell is a defect independent of whatever check happens to
      precede it. An argument provably drawn from a fixed set the file
      itself defines — for example a dict of literal commands looked up
      by a key already checked for membership, or an OS-generated
      temporary path from tempfile.mkdtemp/gettempdir/mkstemp/
      TemporaryDirectory called with no arguments or only already-safe
      arguments — is excluded: nothing in it can be attacker-influenced
      regardless of the identifier's name. Also excluded when every
      non-literal segment of the command is
      wrapped directly in shlex.quote(...)/shlex.join(...), which makes a
      shell treat it as one argument regardless of content. Also excluded
      when the command's entire non-literal content traces to an
      unprocessed sys.stdin read (sys.stdin.read(), json.load(sys.stdin),
      input()) -- a hook or skill-runner's own command-dispatch shape,
      handed over the process's own control channel, analogous to trusting
      argv rather than attacker-reachable input. This exclusion trusts the
      stdin-sourced value's role as a control-channel command wherever it
      appears in the file; it does not verify the surrounding code is
      actually a hook or skill-runner entry point. Also excluded when the
      command's entire non-literal content traces to the operator's own
      command line -- sys.argv[...], an attribute of
      <ArgumentParser>.parse_args()/.parse_known_args(), or a click/typer
      command function's own parameter -- the same argv-is-trusted boundary,
      not attacker-reachable input. Also reported as an observation, rather
      than dropped or reported as a defect, when the command is a bare
      pass-through of a non-entry-point function's own parameter that is
      unreachable in this file from any recognized agent- or web-framework
      entry point (@mcp.tool(), @app.route(), a do_GET-style handler, ...):
      the value is proven to come from a parameter, just not proven to be
      attacker-reachable.
    remediation: >
      Never build a shell command string from anything other than a fixed
      literal. Call the target program directly with an argv list and
      shell=False (subprocess.run([prog, arg1, arg2], shell=False)),
      validate each argument against a strict allowlist of exact values,
      and never pass a caller-supplied string to a shell.

  # ---------------------------------------------------------------------
  # LLM10 — a file is opened at a path built by joining or interpolating
  # a non-literal value, with no os.path.realpath/abspath resolution
  # around the argument. A bare .startswith()/prefix check on the
  # *unresolved* string does not appear anywhere in this pattern's own
  # shape, so it does not suppress the finding — the same "the
  # composition itself is the defect" design as BAS-LLM10-009. Matches
  # docs/rule-catalogue.md's LLM10.9/LLM10.11.
  #
  # metavariable_not_matches closes a genuine contract violation found in
  # final review on 2026-09-23: an os.path.join(...) call whose every
  # argument is a quoted string literal (open(os.path.join("/etc/opsbot",
  # "settings.ini"))) matched the ARG-shape gate's first alternative
  # (`os\.path\.join\(` is a substring test, not a "some argument is
  # non-literal" test) even though nothing about the path is built from a
  # non-literal value at all -- directly contradicting this rule's own
  # title and description. The exclusion regex anchors the *whole* ARG
  # text end-to-end ("os.path.join( then only quoted-literal arguments,
  # comma-separated, then )"), the same technique BAS-LLM10-003 above uses
  # for its own "the whole argument is nothing but quoted-literal
  # segments" exclusion -- adapted here for a call shape instead of a bare
  # literal-concatenation shape. See
  # tests/corpus/clean/near_misses.py's all_literal_join_is_not_flagged
  # for the regression proof.
  #
  # 2026-09-24: the case above -- every os.path.join(...) argument either a
  # literal or a *safe local constant* built once at module level from
  # __file__ (e.g. HERE = os.path.dirname(__file__); open(os.path.join(HERE,
  # "data.json"))) -- is now closed. The Tier-2 dataflow graph's
  # constant_path fact (crates/bastyn-core/src/flow/graph.rs) proves such a
  # value is built only from literals, __file__, and calls to a whitelisted
  # set of pure os.path.* functions, resolving through the module-scope
  # assignment that same-node regex matching could never see on its own.
  # exclude_if: constant_path drops the match when that proof holds. See
  # tests/corpus/clean/near_misses.py's read_bundled_config() for the
  # regression proof (moved from vulnerable/real_misses/
  # path_traversal_safe_local_constant.py, now confirmed safe rather than a
  # known_false_positive).
  #
  # Known gaps, documented rather than papered over:
  #   - a bare-parameter call (open(filename), with no join/f-string/concat
  #     shape in the argument at all) does not match this rule's ARG-shape
  #     gate. See tests/corpus/vulnerable/real_misses/path_traversal_bare_parameter.py.
  #   - a path assembled by os.path.join/f-string/concat in a *prior*
  #     statement and then opened via a variable (path = os.path.join(...);
  #     open(path)) is also not caught -- metavariable_matches only inspects
  #     $ARG's own text at the open() call site, never an earlier assignment.
  #     See tests/corpus/vulnerable/real_misses/path_traversal_variable_then_open.py.
  #   - a function *parameter* joined the same way (os.path.join(root,
  #     filename) where root is a parameter, not a module-level __file__
  #     chain) still fires even when every call site in the file happens to
  #     pass a literal for that parameter -- constant_path only proves a
  #     value from its own definition forward, never across a call
  #     boundary, and telling "every caller happens to pass a literal
  #     today" apart from "a real caller-supplied path" would need genuine
  #     interprocedural call-site analysis, out of scope here (report FP
  #     #6). Recorded as a known_false_positive (a precision debt, not a
  #     recall gap -- the rule fires exactly as its own contract says it
  #     should) at
  #     tests/corpus/vulnerable/real_misses/path_traversal_parameter_with_literal_callers.py;
  #     see tests/corpus/vulnerable/llm10_path_traversal_tool.py's
  #     read_bundled_asset() for the adjacent, correctly-still-firing case
  #     of a parameter reaching os.path.join with no literal-callers-only
  #     guarantee at all.
  #
  # 2026-09-28: the constant_path fact now also understands pathlib, not
  # just os.path.*: Path(__file__)/pathlib.Path(__file__) as a module-level
  # root, and .parent/.resolve()/.absolute()/.with_name(...)/.with_suffix(...)
  # chained on a value already proven constant_path. A file's own location
  # written as a pathlib chain (HERE = Path(__file__).parent; open(HERE /
  # "overlay.js")) is exactly as safe as the same root written with
  # os.path.dirname, and previously fell outside this exclusion purely
  # because it used a different, equally common stdlib API for the same
  # thing. Also, a value returned by tempfile.mkdtemp/gettempdir/mkstemp/
  # TemporaryDirectory (called with no arguments, or only arguments that
  # are themselves already safe) is now closed the same way: the operating
  # system generates the path, not any caller or the file's own location,
  # but it is equally provably fixed. See tests/corpus/clean/tempdir_shell.py
  # and the pathlib-rooted cases in tests/corpus/clean/near_misses.py for the
  # regression proofs.
  #
  # 2026-09-28: added exclude_if: cli_argument to close a false positive on
  # a path built from the operator's own command line -- an argparse
  # --eval-dir-style option joined into an open() path, the same
  # "handed over the process's own control channel, not attacker-reachable"
  # trust boundary BAS-LLM10-009's stdin_dispatch/cli_argument exclusions
  # already grant. Kept exactly as narrow as those: a path mixing a
  # CLI-argument segment with any other non-literal segment (HTTP request
  # data, say) still fires. See tests/corpus/clean/cli_argument_paths.py and
  # vulnerable/llm10_path_traversal_tool.py's export() for the regression
  # proofs.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-012
    title: File opened at an unresolved path built by joining or interpolating a non-literal value
    kind: defect
    severity: high
    confidence: medium
    categories: [LLM10]
    language: python
    any:
      - open($ARG)
      - open($ARG, $$$MODE)
    none:
      - open(os.path.realpath($$$A))
      - open(os.path.realpath($$$A), $$$MODE)
      - open(os.path.abspath($$$A))
      - open(os.path.abspath($$$A), $$$MODE)
      - open(safe_join($$$A))
      - open(safe_join($$$A), $$$MODE)
      - open(werkzeug.utils.safe_join($$$A))
      - open(werkzeug.utils.safe_join($$$A), $$$MODE)
    metavariable_matches:
      ARG: '(os\.path\.join\(|^f["\x27]|["\x27]\s*\+\s*\w|\w\s*\+\s*["\x27])'
    metavariable_not_matches:
      ARG: '^os\.path\.join\(\s*(("([^"\\]|\\.)*")|(''([^''\\]|\\.)*''))(\s*,\s*(("([^"\\]|\\.)*")|(''([^''\\]|\\.)*'')))*\s*\)$'
    exclude_if:
      variable: ARG
      kind: [constant_path, cli_argument]
    description: >
      A file is opened at a path built inline, directly inside the
      open(...) call, by os.path.join, f-string interpolation, or string
      concatenation with a non-literal value, and the argument is never
      wrapped in os.path.realpath/abspath. A relative-traversal segment
      (../../etc/passwd) or a symlink planted inside the intended
      directory escapes whatever containment the surrounding code
      assumes, because the raw joined string is never resolved before
      use — a string-prefix check elsewhere in the function does not
      change this, since it tests the same unresolved string. An
      os.path.join(...) call whose every argument is a fixed string
      literal is excluded: nothing in it is non-literal, so it is not
      "built from a non-literal value" at all. Detection requires the
      join/f-string/concat expression to appear directly as the open()
      argument; a path assembled the same way in a prior statement and
      then passed in as a variable (path = os.path.join(...); open(path))
      is not detected — the matcher only inspects the argument's own text
      at the call site, not any earlier assignment. Also excluded when the
      joined path is built only from literals, __file__, and calls to
      os.path.dirname/abspath/realpath/normpath/join/os.getcwd, a
      pathlib.Path chain rooted the same way (Path(__file__).parent,
      .resolve(), .with_name(...), .with_suffix(...)), or a value returned
      by tempfile.mkdtemp/gettempdir/mkstemp/TemporaryDirectory called with
      no arguments or only already-safe arguments — a module-level path
      root the file derives from its own location on disk or an
      OS-generated temporary path, not from anything a caller supplies.
      Also excluded when the path's entire non-literal content traces to
      the operator's own
      command line -- sys.argv[...], an attribute of
      <ArgumentParser>.parse_args()/.parse_known_args(), or a click/typer
      command function's own parameter -- not attacker-reachable input; a
      path mixing a CLI-argument segment with any other non-literal segment
      still fires.
    remediation: >
      Resolve the joined path with os.path.realpath (not just
      os.path.abspath, which does not follow symlinks) before using it,
      and verify the resolved path is contained under the intended root
      directory (os.path.commonpath, or a vetted helper like
      werkzeug.utils.safe_join) before opening it.

  # ---------------------------------------------------------------------
  # LLM10 — the same execute()-of-untrusted-SQL shape BAS-LLM10-003
  # already catches, but unconditional: BAS-LLM10-003 only fires when the
  # argument's own text names a response/reply/... variable. This rule
  # drops that name gate, the same way BAS-LLM10-009 drops it for shell
  # commands -- interpolating any non-literal value into a query string
  # instead of binding it as a parameter is wrong regardless of what the
  # value is named or where it came from.
  #
  # metavariable_not_matches (added 2026-09-24 to fix all 4 BAS-LLM10-017
  # report false positives) originally excluded any f-string that merely
  # *opened* with a DDL keyword (PRAGMA/ALTER TABLE/...), without checking
  # the rest of the string -- so f"CREATE TABLE {name} AS SELECT * FROM
  # src WHERE owner = '{user_filter}'" and f"ALTER TABLE t ADD COLUMN c
  # TEXT DEFAULT '{user_filter}'" were both wrongly excluded, even though
  # each interpolates a real query *value* (wrapped in the opposite quote
  # character) alongside the DDL keyword. Tightened the same day, final
  # review: the exclusion now also requires no quote character (of either
  # kind) anywhere between the DDL keyword and the closing delimiter --
  # a genuine SQL identifier never needs quoting in DDL, a value literal
  # always does. See tests/corpus/vulnerable/llm10_unparameterized_sql_tool.py's
  # materialize_filtered_table() / add_column_with_default() for the
  # regression fixtures.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-017
    title: Unparameterized query built by interpolation reaches SQL execution
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - $CUR.execute($ARG)
    none:
      - $CUR.execute("$LIT")
      - $CUR.execute('$LIT')
      - $CUR.execute("""$LIT""")
      - $CUR.execute('''$LIT''')
      - $CUR.execute($ARG, $PARAMS)
    metavariable_matches:
      CUR: "(?i)(cursor|cur|db|conn|connection)"
      ARG: '(^f["\x27]|["\x27]\s*\+\s*\w|\w\s*\+\s*["\x27]|%\s*\()'
    metavariable_not_matches:
      ARG: '(?i)^f["\x27]\s*(PRAGMA|ALTER\s+TABLE|CREATE\s+TABLE|DROP\s+TABLE|CREATE\s+INDEX|DROP\s+INDEX)\b[^"\x27]*["\x27]$'
    description: >
      A database cursor executes a query string built by f-string
      interpolation, concatenation, or %-formatting, with the
      interpolated value passed inline rather than as a separate bind
      parameter. This reports the composition unconditionally rather
      than gating on the interpolated value's name or provenance.
      Excluded when the string opens with a schema-definition keyword
      (PRAGMA, ALTER TABLE, CREATE TABLE, DROP TABLE, CREATE/DROP INDEX)
      and no interpolated value literal (quoted) appears anywhere in the
      rest of the statement — SQL identifiers such as table and column
      names cannot be bound as query parameters at all, so interpolating
      one here is the correct way to write this. A DDL statement that
      also interpolates a quoted value (for example a WHERE/DEFAULT
      clause built onto a CREATE/ALTER) still fires, since that value
      could have been bound as a parameter and was not.
    remediation: >
      Never interpolate a value into a SQL string. Use parameterized
      queries (cursor.execute(sql, params)) and keep every dynamic value
      confined to a bind parameter, never to the query text itself.

  # ---------------------------------------------------------------------
  # LLM10 — the same defect as BAS-LLM10-017, split across two
  # statements: the interpolated query is assigned to a local variable
  # one line before the execute() call that consumes it. BAS-LLM10-017's
  # same-node ARG-shape gate cannot see this -- $ARG's captured text at
  # the execute() call site is just the variable name, not the f-string
  # that built it. This is the literal shape of
  # tests/corpus/vulnerable/real_misses/sql_from_tool_parameter.py's
  # known_gap.
  #
  # The pattern is written as `def ... $$$PRE ... execute($SQL) $$$REST`
  # rather than a bare two-statement pattern because ast_grep_core's
  # Pattern::try_new rejects a pattern spanning two module-level sibling
  # statements ("Multiple AST nodes are detected") -- they share no
  # parent node outside of a whole function body. Wrapping the pair in a
  # `def` gives the pattern a single root node to anchor on, at the cost
  # of reporting the def line rather than the assignment/execute line.
  #
  # `$$$REST` is a variadic capture for zero-or-more trailing statements,
  # but this engine's multi-line pattern parser does not actually treat
  # it as zero-or-more in the last-child position: a function where
  # execute() is the literal last statement (the common "fire and
  # forget" INSERT/UPDATE/DELETE shape, with nothing returned or run
  # afterward) failed to match the four variants above, even though
  # $$$REST should bind to an empty statement list. Fixed 2026-09-23 by
  # adding four sibling variants below, identical except they end
  # immediately after the execute() call with no `$$$REST` tail --
  # mirroring how BAS-LLM03-001 in this same file expresses its
  # `-> $RET` / no-return-type variants as separate `any:` entries
  # rather than one pattern trying to cover both shapes.
  #
  # 2026-09-24 final review: this rule has the same DDL-identifier false
  # positive Finding 2 fixed for BAS-LLM10-017 above (sql = f"ALTER TABLE
  # {table} ADD COLUMN {column} TEXT"; conn.execute(sql) is a genuine
  # schema-identifier interpolation, not a value injection, and should not
  # fire). Tried the -017-style fix here: a `metavariable_not_matches:
  # {FSTR: '(?i)^(PRAGMA|ALTER\s+TABLE|...)\b[^"\x27]*$'}` clause against
  # $$$FSTR, the variadic capture this rule's `any:` patterns bind the
  # f-string's inner text to. Confirmed empirically (built the scanner
  # with the clause added and ran it against both a DDL-only fixture and
  # an existing true-positive fixture) that it compiles but never excludes
  # anything -- the DDL-only fixture still fired. Root cause traced to
  # ast_grep_core::meta_var::MetaVarEnv: a `$$$`-prefixed capture is stored
  # in `multi_matched`, but both `metavariable_matches` and
  # `metavariable_not_matches` in this engine's CompiledRule only ever
  # call `env.get_match(var)`, which reads `single_matched` -- the same
  # limitation already documented for `metavariable_matches` against
  # `$$$OVERRIDE`-shaped captures (see the vulnerable/real_misses/
  # three_interpolation_override.py known_gap). Not attempted as a rule
  # fix; recorded instead as a known_false_positive. See
  # tests/corpus/vulnerable/real_misses/sql_ddl_via_local_variable.py.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-018
    title: Unparameterized query assigned to a local variable then executed
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM10]
    language: python
    any:
      - "def $FN($$$ARGS):\n    $$$PRE\n    $SQL = f\"$$$FSTR\"\n    $CUR.execute($SQL)\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    $SQL = f\"$$$FSTR\"\n    $CUR.execute($SQL)\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    $SQL = f'$$$FSTR'\n    $CUR.execute($SQL)\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    $SQL = f'$$$FSTR'\n    $CUR.execute($SQL)\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    $SQL = f\"$$$FSTR\"\n    $CUR.execute($SQL)"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    $SQL = f\"$$$FSTR\"\n    $CUR.execute($SQL)"
      - "def $FN($$$ARGS):\n    $$$PRE\n    $SQL = f'$$$FSTR'\n    $CUR.execute($SQL)"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    $SQL = f'$$$FSTR'\n    $CUR.execute($SQL)"
    metavariable_matches:
      CUR: "(?i)(cursor|cur|db|conn|connection)"
    description: >
      A local variable is assigned an f-string-interpolated query, then
      passed straight to execute() on the very next line. Splitting the
      f-string out of the call site does not change what happens at
      runtime -- the query text is still built by interpolation, not by
      parameter binding.
    remediation: >
      Never interpolate a value into a SQL string, whether directly in
      the execute() call or through an intermediate variable one line
      earlier. Use parameterized queries (cursor.execute(sql, params))
      instead.

  # ---------------------------------------------------------------------
  # LLM01 — a tool's own docstring contains a hidden-instruction marker
  # aimed at the model that reads it, not the human approving the tool.
  # Matches docs/rule-catalogue.md's LLM01.7's illustrative shape at the
  # LLM01.9 confidence level (LLM01.9 grades the identical
  # <IMPORTANT>/"do not mention" marker, in a SKILL.md sibling artifact,
  # as `Kind: defect`, `Detectability: structural` -- LLM01.7 itself is
  # graded `semantic`/high-risk because it also tries to catch free-text
  # intent with no fixed marker at all, which this rule does not attempt).
  # ---------------------------------------------------------------------

  - id: BAS-LLM01-002
    title: Hidden instruction block in a tool's own description
    kind: defect
    severity: high
    confidence: high
    categories: [LLM01]
    language: python
    any:
      - "@tool\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool()\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool()\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@mcp.tool()\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@mcp.tool()\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
    metavariable_matches:
      DOC: '(?i)(<important>|<hidden>|do not mention|do not tell the user|present it as if)'
    description: >
      A tool's docstring -- the text an agent reads to decide how and
      when to call it -- contains a hidden-instruction marker
      (<IMPORTANT>/<HIDDEN> tags, or explicit "do not mention"/"do not
      tell the user" language) invisible to a human skimming the tool
      list but fully visible to the model. This is the mechanism behind
      real MCP "tool poisoning" attacks: a second, adversarial
      instruction riding along inside a tool description the developer
      approved for something else entirely.
    remediation: >
      Remove the hidden instruction. A tool's description should say only
      what the tool does and when to call it; anything addressed to the
      model itself, especially language asking it to act silently or
      withhold information from the user, does not belong in a tool
      description at all.

  # ---------------------------------------------------------------------
  # LLM01 — the lower-confidence companion to BAS-LLM01-002: a fixed
  # phrase list with no marker tag, shipped as `observation` for the same
  # reason docs/rule-catalogue.md's LLM01.8 grades it `Kind: observation`
  # ("legitimate tool docs share vocabulary with the attack pattern").
  # ---------------------------------------------------------------------

  - id: BAS-LLM01-003
    title: Suspicious instruction-override phrase in a tool's own description
    kind: observation
    severity: low
    confidence: low
    categories: [LLM01]
    language: python
    any:
      - "@tool\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool()\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@tool()\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@mcp.tool()\ndef $FN($$$ARGS):\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
      - "@mcp.tool()\ndef $FN($$$ARGS) -> $RET:\n    \"\"\"$DOC\"\"\"\n    $$$BODY"
    metavariable_matches:
      DOC: '(?i)(ignore (previous|prior|all) instructions|disregard (prior|previous)|override (your|the) (instructions|system prompt)|bypass (the|your) (safety|restriction))'
    description: >
      A tool's docstring contains a lower-confidence lexical signal --
      phrasing like "ignore previous instructions," "override the system
      prompt," or "bypass the safety restriction." Legitimate tool
      documentation occasionally shares vocabulary with this pattern
      ("always confirm before deleting" does not trip it, but a looser
      phrasing might), which is why this is an observation rather than a
      defect.
    remediation: >
      Review the tool description's wording. If it is not legitimately
      instructing the agent about the tool's own confirmation/safety
      behavior, remove the phrasing; if the tool comes from a
      third-party MCP server, treat this as a signal to audit the
      server's other tool descriptions too.

  # ---------------------------------------------------------------------
  # LLM01 / ZT4 — untrusted input reaching a prompt without separation from
  # instructions. This is the shape every "ignore previous instructions"
  # attack depends on.
  # ---------------------------------------------------------------------

  - id: BAS-ZT4-001
    title: Raw user input folded directly into a system prompt
    kind: defect
    severity: high
    confidence: high
    categories: [LLM01, ZT4]
    language: python
    any:
      - $SYS = f"$$$A{$VAR}$$$B"
    metavariable_matches:
      SYS: "(?i)(system|prompt|instruction|persona|template)"
    # SYS stays a name gate: the assignment target's name is what marks the
    # string as a prompt. VAR is tested for provenance instead: a defect when
    # it traces to request data, tool output, retrieved context or a file or
    # network read; an observation when its origin cannot be traced and its
    # name still reads as user input. A prompt that this file sends in the
    # user role is not a system prompt at all.
    flow:
      variable: VAR
      source: [http_request, tool_output, retrieved_context, network_read, file_read]
      unguarded: true
      unproven:
        kind: observation
        requires:
          VAR: "(?i)(user|request|query|input|raw|message)"
    none_in_file:
      - '{"role": "user", "content": $SYS}'
      - "{'role': 'user', 'content': $SYS}"
      - '{"content": $SYS, "role": "user"}'
      - "{'content': $SYS, 'role': 'user'}"
    description: >
      A system/instruction prompt is built by f-string-interpolating
      untrusted input directly into the instruction text, with no delimiter
      separating "what the model must do" from "what the user said." Whoever
      controls that input can rewrite the model's instructions.
    remediation: >
      Keep untrusted input out of the instruction channel. Pass it as a
      separate user/tool message, or through a templating layer (e.g.
      ChatPromptTemplate) that keeps it in a clearly delimited data slot the
      model is told to treat as content, not as commands.

  # ---------------------------------------------------------------------
  # ZT1 — Identity and Credentials.
  # ---------------------------------------------------------------------

  # Measured as non-firing on 2026-08-28 across 65 real third-party AI
  # repositories, and deliberately kept. This is not a broken rule: its
  # JS/TS twin (BAS-ZT1-003, which reaches .ts and .tsx too) uses the
  # identical `sk-` gate and fired 5 times on the same corpus, so the gate
  # works and the shape is
  # real. What the corpus contains is zero `sk-`-shaped literals in Python —
  # grepped directly, not inferred from the scan. A rule that is rare is not
  # a rule that is wrong, and the cost of keeping it is one pattern that
  # cannot match anything but a provider key.
  - id: BAS-ZT1-001
    title: Hardcoded API key
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: python
    # A live provider key is leaked wherever it sits, including a fixture:
    # the fix is to rotate it, and the test-path downgrade must not be what
    # hides it. The honest cost, measured 2026-08-28: the one `sk-` literal
    # this rule set found in a test path across 65 repositories was a
    # placeholder ('sk-must-not-enter-argv'). The downgrade is not a
    # fake-key filter — the same placeholders turn up in shipped code too —
    # so gating on the path would trade a real leak for one fake.
    in_test_paths: report
    any:
      - $VAR = "$SECRET"
      - $VAR = '$SECRET'
    metavariable_matches:
      SECRET: "^sk-[A-Za-z0-9_-]{16,}$"
    description: >
      A provider API key is a literal in source rather than read from the
      environment or a secret manager. It ships with every clone of the repo,
      every log of the source, and every fork.
    remediation: >
      Load the key from an environment variable or secret manager
      (os.environ["OPENAI_API_KEY"]) and rotate the key that leaked into
      history.

  # ---------------------------------------------------------------------
  # LLM08 — Hidden Context Exposure: a secret baked into text the model
  # itself will see (and can therefore repeat back to a user).
  # ---------------------------------------------------------------------

  # Measured as non-firing on 2026-08-28, and deliberately kept, for exactly
  # the same reason as BAS-ZT1-001 above: it gates on the same `sk-` shape,
  # and the calibration corpus contains no `sk-`-shaped literal in any Python
  # file at all. Nothing about the rule was tested by that run — it is a
  # narrower rule than ZT1-001 (the literal must also sit in a
  # prompt/template/system-named variable), so a corpus that cannot exercise
  # the broader one cannot exercise this either.
  - id: BAS-LLM08-001
    title: Secret embedded inside a prompt template
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM08]
    language: python
    any:
      - $VAR = "$CONTENT"
    metavariable_matches:
      VAR: "(?i)(prompt|template|system|instruction|persona)"
      CONTENT: "(?i)sk-[A-Za-z0-9_-]{16,}"
    description: >
      A credential-shaped secret is embedded in the text of a prompt or
      system-message template. Once a secret is part of what the model reads,
      it is part of what the model can be tricked into repeating — a
      "don't reveal this" instruction is not a control the model reliably
      enforces.
    remediation: >
      Never put real secrets in prompt text, including as "internal only"
      instructions. Keep credentials out of the context window entirely; if
      the model needs to use a credential, do it via a tool call the
      application executes server-side.

  # ---------------------------------------------------------------------
  # LLM03 — Excessive Agency: a destructive tool exposed to the agent with
  # no guard, detected as the absence of an early confirmation check in the
  # same function.
  # ---------------------------------------------------------------------

  - id: BAS-LLM03-001
    title: Unauthorized agent tool exposed without a confirmation guard
    # An observation: the function's name is the only evidence that the tool
    # changes state, and a name is not proof.
    kind: observation
    severity: high
    confidence: medium
    categories: [LLM03]
    language: python
    any:
      - "def $FN($$$ARGS):\n    $$$BODY"
      - "def $FN($$$ARGS) -> $RET:\n    $$$BODY"
    # Enumerating guard shapes is structurally incomplete: a guard can live in
    # a decorator, in middleware, or in the API the tool calls, and this list
    # can only ever grow. That is why confidence is `medium` rather than
    # `high`. Every shape here was added because a real safe function was
    # otherwise reported — see tests/corpus/clean/tools.py.
    none:
      - "def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        raise $EXC\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    if not $COND:\n        return $EARLY\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "def $FN($$$ARGS):\n    $$$PRE\n    assert $COND\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND, $MSG\n    $$$REST"
      - "def $FN($$$ARGS) -> $RET:\n    $$$PRE\n    assert $COND\n    $$$REST"
    inside:
      - "@tool\ndef $FN2($$$A):\n    $$$B"
      - "@tool\ndef $FN2($$$A) -> $R2:\n    $$$B"
      - "@tool()\ndef $FN2($$$A):\n    $$$B"
      - "@tool()\ndef $FN2($$$A) -> $R2:\n    $$$B"
    # Widened 2026-08-28 after a head-to-head benchmark against a Python
    # prototype: the prototype flagged all 8 undecorated @tool functions in
    # one real repository file, this rule caught 1 (the one destructively
    # named). The other 7 -- create_event, update_event, list_events,
    # get_calendar_list, get_freebusy_info, is_available_for_meeting,
    # send_confirmation -- are equally unauthorized, just not named
    # delete/drop/.... Added every state-changing verb the same benchmark's
    # own two-tier split (destructive-critical vs. non-destructive-high)
    # used, minus "add" and "set" and "pay" and "book" -- each collides with
    # a common English word as a bare prefix (address, settings, payload,
    # bookmark) that a naming gate anchored only at the start cannot tell
    # apart from the verb. Read-only verbs (get, list, search, calculate,
    # ...) are deliberately absent: tests/corpus/clean/tools.py's
    # get_server_status must stay unflagged.
    metavariable_matches:
      FN: "(?i)^(delete|drop|remove|transfer|withdraw|wire|drain|revoke|terminate|shutdown|sell_all|liquidate|send_funds|execute_trade|purge|wipe|create|update|edit|modify|insert|cancel|approve|reject|install|uninstall|register|grant|subscribe|schedule|submit|publish|deploy|charge|refund|send)"
    description: >
      A tool exposed to the agent is named like a privileged or state-changing
      action (delete, transfer, create, update, ...) with no guard clause at
      the top of its body checking a confirmation or authorization condition
      before acting. If the agent decides to call it, it executes
      unconditionally.
    remediation: >
      Require explicit confirmation or an authorization check before the tool
      acts: check a confirmed/approved flag (or re-verify authorization) as
      the first thing the function does, and raise or return early when it is
      not satisfied.

  # ---------------------------------------------------------------------
  # LLM06 — Unbounded Consumption. Context-dependent: a limiter can live at
  # the edge (gateway, proxy) where this repo cannot see it. Observation
  # only, never a defect — see category::is_context_dependent.
  # ---------------------------------------------------------------------

  - id: BAS-LLM06-001
    title: LLM call has no token ceiling
    kind: observation
    severity: low
    confidence: medium
    categories: [LLM06]
    language: python
    any:
      - $CLIENT.chat.completions.create($$$ARGS)
    none:
      - $CLIENT.chat.completions.create(max_tokens=$MT, $$$B)
      - $CLIENT.chat.completions.create($$$A, max_tokens=$MT)
      - $CLIENT.chat.completions.create($$$A, max_tokens=$MT, $$$B)
    metavariable_matches:
      CLIENT: "(?i)(client|llm|openai|gpt)"
    description: >
      This completion call sets no max_tokens, so nothing in the repository
      bounds a single call's cost or latency. A gateway, proxy, or SDK default
      elsewhere may already cap this — the source alone cannot say — which is
      why this is an observation rather than a defect.
    remediation: >
      Set an explicit max_tokens (or the provider's equivalent) on the call,
      or confirm and document the upstream limiter that bounds it.

  # ---------------------------------------------------------------------
  # ZT1 — a credential-shaped string literal anywhere a value can sit, not
  # just a direct `$VAR = "$SECRET"` assignment. BAS-ZT1-001 only anchors on
  # the assignment shape, so a secret that is instead a dict-literal value
  # (an ordinary shape for a runtime settings object) has no assignment
  # target of its own and never matches it. This rule drops the assignment
  # requirement entirely and gates on the value's own shape instead: a
  # connection string with inline user:pass@ credentials, or a token whose
  # text names itself as a secret and carries a long hex-like body.
  # ---------------------------------------------------------------------

  - id: BAS-ZT1-002
    title: Hardcoded credential in a collection literal
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: python
    any:
      - '"$VALUE"'
    metavariable_matches:
      VALUE: '(:\/\/[^\s/:@]+:[^\s/@]+@)|((?i:secret|token|password|api[_-]?key|private[_-]?key)[-_][0-9a-f]{12,})'
    # Measured 2026-08-28, after the test_path downgrade above already
    # removed the fixture-DSN majority: 9 of this rule's remaining findings
    # were still false positives, all a default connection string in an
    # os.getenv(..., "...")-style fallback in application config -- shipped
    # code, not a fixture, so `in_test_paths` cannot help. Every one pointed
    # at localhost/127.0.0.1.
    #
    # This is a value-shape exclusion, not a path one, and deliberately not
    # folded into the test_path mechanism: a DSN whose host is localhost can
    # never reach anything outside the machine it runs on, so it is not a
    # usable credential regardless of which file it sits in -- a stronger,
    # more certain signal than "this path looks like a fixture" (which is
    # why in_test_paths downgrades rather than deletes: a real secret really
    # does turn up in a test file sometimes). See
    # vulnerable/tests/test_settings_fixture.py's docstring for the other
    # half of that reasoning.
    #
    # Restricted to the localhost/127.0.0.1 host signal alone, not the wider
    # placeholder-word list (password/secret/changeme/...) the false-positive
    # writeup for this bug also suggested: this rule's second `VALUE`
    # alternative requires exactly those words ("secret"/"token"/"password"/
    # "api_key"/"private_key" followed by a hex body) to fire at all, so
    # excluding on them would gut that alternative entirely -- see
    # vulnerable/real_misses/hardcoded_dict_secrets.py's admin_secret entry,
    # a real finding that contains the word "SECRET".
    metavariable_not_matches:
      VALUE: '(?i)://[^\s/@]*:[^\s/@]*@(localhost|127\.0\.0\.1)([:/]|$)'
    description: >
      A string literal's own content is credential-shaped -- either a
      connection string with a username and password embedded before the
      "@" host separator, or a token whose name says "secret"/"token"/... and
      is followed by a long hex-like body. Unlike a direct `$VAR = "..."`
      assignment, this fires wherever the literal sits: a dict value, a list
      entry, a function argument.
    remediation: >
      Never embed a password inside a connection string or a live token in
      source. Load the credential from an environment variable or secret
      manager, and rotate whatever leaked into history.

  # ---------------------------------------------------------------------
  # LLM10 -- eval()/exec() run on anything other than a string literal. A
  # defect when the flow graph traces the argument to a catalogued untrusted
  # source (model output, request data, retrieved context, tool output, a
  # file or network read); an observation when it cannot trace it at all.
  # A literal, a value closed over literals, or one a fixed-set guard
  # already limits is not reported.
  # ---------------------------------------------------------------------

  - id: BAS-LLM10-004
    title: eval() or exec() run on a non-literal expression
    kind: defect
    severity: high
    confidence: medium
    categories: [LLM10]
    language: python
    # Both `any:` shapes below used to be single-argument only. Python's
    # exec() and eval() both accept optional positional globals/locals dict
    # arguments (exec(source, globals=None, locals=None)) -- an ordinary,
    # common idiom, often used specifically to *sandbox* the call (passing a
    # restricted globals dict). Because that idiom is common, a 2/3-arg call
    # is an especially important case to catch when the sandbox dict is
    # incomplete, not a rare edge case to skip. A two- or three-argument
    # call such as exec(manifest["setup_code"], {}) used to be missed purely
    # because of the extra argument; see
    # tests/corpus/vulnerable/real_misses/exec_with_globals_dict.py.
    any:
      - eval($ARG)
      - exec($ARG)
      - eval($ARG, $GLOBALS)
      - eval($ARG, $GLOBALS, $LOCALS)
      - exec($ARG, $GLOBALS)
      - exec($ARG, $GLOBALS, $LOCALS)
    none:
      - eval("$LIT")
      - exec("$LIT")
      - eval("$LIT", $GLOBALS)
      - eval("$LIT", $GLOBALS, $LOCALS)
      - exec("$LIT", $GLOBALS)
      - exec("$LIT", $GLOBALS, $LOCALS)
    # No `source:` here, deliberately, since 2026-09-25: this rule no longer
    # gates on where the argument's value came from at all, the same
    # unconditional-composition philosophy BAS-LLM10-009/-017/-018 already
    # use. Legitimate eval()/exec() on a variable (as opposed to a fixed
    # literal) is rare enough that catalogued-source provenance was buying
    # little precision while actively hiding real findings. Before this
    # change, `source:` already listed all six SourceKind variants with no
    # `requires` filter, so an untraced value was never actually dropped --
    # it was already reported, just as a hidden, low-confidence observation
    # behind `unproven:` and `--show-observations`, not as a defect. Two real
    # eval()/exec() calls on an untraceable value (a function parameter, or a
    # value one hop from one) used to be buried that way purely because the
    # engine could not name which catalogued source produced the value -- not
    # because the call was any safer. A value closed over names this program
    # fixes (class_name = self.__class__.__name__) and one already limited by
    # a `not in (...)` check against literals are still dropped by the flow
    # graph's closed/guard checks, and `builtin_callee` still drops a call
    # through a name this file rebinds itself (a local `def eval`) -- those
    # are the protections worth keeping; provenance was not. See
    # tests/corpus/vulnerable/real_misses/eval_guarded_by_local_check.py for
    # the guard/closed cases that still do not fire, and
    # tests/corpus/vulnerable/real_misses/eval_compile_rce.py and
    # exec_with_globals_dict.py for the two untraceable-origin calls that now
    # correctly report as defects instead of hidden observations (a third
    # fixture, eval_on_untraceable_parameter.py, was added for this change
    # and never had prior behavior of its own).
    flow:
      variable: ARG
      unguarded: true
      builtin_callee: true
    description: >
      eval()/exec() is called with an argument that is not a string literal.
      Whatever produced this value, running it is arbitrary code execution
      the moment its contents are attacker-influenceable, and there is no way
      to prove from the repository alone that they never are. This is
      reported unconditionally, the same way a non-literal command reaching a
      shell (BAS-LLM10-009) is: a check the flow graph can prove closes over
      fixed literals, or a guard that already dominates the call, still drops
      the match, but an untraceable origin is now a full defect rather than a
      hidden, low-confidence observation.
    remediation: >
      Never run eval()/exec() on anything other than a fixed literal. If the
      agent needs to run model-suggested logic, parse it into a constrained,
      whitelisted set of operations instead of eval/exec.

  # ---------------------------------------------------------------------
  # LLM01 / ZT4 — a system prompt built from more than one interpolation,
  # where the first is a caller-supplied override. BAS-ZT4-001 requires
  # exactly one interpolation in the f-string, so a prompt that splices in
  # a full override alongside other context never matches it structurally.
  # ---------------------------------------------------------------------

  - id: BAS-ZT4-002
    title: System prompt built from a caller-supplied override
    kind: defect
    severity: high
    confidence: high
    categories: [LLM01, ZT4]
    language: python
    # Assignment and bare return, both with exactly two interpolations.
    #
    # The interpolation count is a known limitation, not a choice. A
    # count-independent pattern (`f"$$$PARTS"` gated by a regex on PARTS) was
    # tried and does not work: `metavariable_matches` has no effect on a `$$$`
    # multi-node capture, so the gate is the only thing standing between that
    # pattern and flagging every f-string in the repository. A real application
    # interpolating three values is therefore still missed — recorded as a
    # known gap rather than papered over.
    #
    # The `or`-fallback shape was added on 2026-08-28. Across 65 real
    # third-party AI repositories the f-string shapes above fired zero times,
    # and the single caller-supplied prompt override the corpus contained was
    # written the way an optional argument is ordinarily written in Python:
    # `system_prompt = system_override or self._build_system_prompt(...)`.
    # That is the stronger version of the same defect -- the override does not
    # get spliced into the instructions, it replaces them entirely -- and it
    # is what the interpolation-counting patterns above structurally cannot
    # see. The SYS name gate and the OVERRIDE provenance test are what keep
    # it off every ordinary `x = y or default`.
    #
    # The self-concatenation shapes ($SYS = $SYS + $OVERRIDE and its
    # augmented-assignment sugar $SYS += $OVERRIDE) cover appending a
    # header-supplied value to the instructions, a shape the interpolation
    # and or-fallback patterns cannot see.
    any:
      - '$SYS = f"$$$A{$OVERRIDE}$$$B{$VAR2}$$$C"'
      - 'return f"$$$A{$OVERRIDE}$$$B{$VAR2}$$$C"'
      - '$SYS = $OVERRIDE or $FALLBACK'
      - '$SYS = $SYS + $OVERRIDE'
      - '$SYS += $OVERRIDE'
    metavariable_matches:
      SYS: "(?i)(system|prompt|instruction|persona|template)"
    flow:
      variable: OVERRIDE
      source: [http_request, tool_output, retrieved_context, network_read, file_read]
      unguarded: true
      unproven:
        kind: observation
        requires:
          OVERRIDE: "(?i)(override|overridden|custom_instructions|force_prompt)"
    none_in_file:
      - '{"role": "user", "content": $SYS}'
      - "{'role': 'user', 'content': $SYS}"
      - '{"content": $SYS, "role": "user"}'
      - "{'content': $SYS, 'role': 'user'}"
    description: >
      A system/instruction prompt is built by f-string-interpolating a value
      named as an override directly into the instruction text, alongside
      other content. If that value is caller-controlled -- a request
      parameter, a header, a stored setting -- it fully replaces the fixed
      instructions rather than being confined to a data field.
    remediation: >
      Do not let a caller-supplied value replace or prepend the system
      instructions. If per-request customization is a real requirement, keep
      it in a clearly delimited data slot the model is told to treat as
      content, and keep the base instructions fixed and caller-invisible.

  # ---------------------------------------------------------------------
  # ZT2 — Least Agency and Access. A wildcard tool grant in application
  # code, not just inside a recognised MCP config file (BAS-MCP-003 only
  # inspects the latter).
  #
  # Measured as non-firing on 2026-08-28 across 65 real third-party AI
  # repositories, and deliberately kept. The corpus was checked directly, not
  # just by the scan: `allowed_tools` appears in exactly one repository, and
  # there it is always a scoped list, never `"*"`. There is no near-miss
  # shape this rule is failing to reach — the defect simply is not present.
  # Keeping it costs two string patterns and an `inside` constraint that
  # cannot match anything except the literal grant it describes.
  # ---------------------------------------------------------------------

  - id: BAS-ZT2-001
    title: Wildcard tool grant in agent-construction code
    kind: defect
    severity: high
    confidence: high
    categories: [ZT2]
    language: python
    # `any` anchors on the "*" literal itself, not the enclosing call --
    # matching the call would report the call's own opening line, not the
    # keyword argument's line. `inside` then requires that literal to
    # actually be the allowed_tools value of some call, in either quote
    # style.
    any:
      - '"*"'
      - "'*'"
    inside:
      - '$FN(allowed_tools="*", $$$REST)'
      - '$FN($$$PRE, allowed_tools="*")'
      - '$FN($$$PRE, allowed_tools="*", $$$REST)'
      - "$FN(allowed_tools='*', $$$REST)"
      - "$FN($$$PRE, allowed_tools='*')"
      - "$FN($$$PRE, allowed_tools='*', $$$REST)"
    description: >
      An agent is constructed with allowed_tools="*", granting every tool
      registered on it -- present and future -- rather than the specific
      handful the task actually needs. A new destructive tool added later is
      trusted automatically, with no review of this wiring.
    remediation: >
      Replace the wildcard with an explicit list of the tool names this
      agent actually needs. Review that list whenever a new tool is added to
      the pool it draws from.

  # ---------------------------------------------------------------------
  # TypeScript / JavaScript. The JS/TS agentic ecosystem this targets is
  # LangChain.js, the Vercel AI SDK, and the official MCP TypeScript SDK --
  # the same shapes as the Python rules above, ported to the syntax those
  # libraries actually use.
  #
  # ast-grep's JS/TS pattern matching turned out to be quote-sensitive: a
  # pattern written with double quotes does not match a string literal
  # written with single quotes, and vice versa (Python's grammar treats
  # quote style as insignificant for `Pattern` matching; JS/TS's does not).
  # Every rule below that anchors on a string literal therefore lists both
  # quote styles in `any` -- the same shape BAS-ZT1-001 above already uses
  # for Python, just for a different reason there (style preference, not a
  # matcher requirement).
  # ---------------------------------------------------------------------

  # Widened on 2026-08-28. This rule used to require the argument's own text
  # to name a response/reply/completion/... variable, and across 65 real
  # third-party AI repositories it never fired once. The reason is visible in
  # the corpus: every real eval()/new Function() call on model-derived text
  # reached it through a variable named for *what the value is* --
  # `expression`, `calculation`, `resolved` -- because that is how developers
  # name things. Python already made this trade in BAS-LLM10-004: drop the
  # name gate, keep only the literal-argument exclusion, and pay for it with
  # `confidence: medium` rather than `high`. eval() on anything that is not a
  # fixed literal is a code-execution smell regardless of where the value
  # came from.
  - id: BAS-LLM10-005
    title: eval() or new Function() run on a non-literal expression (JS)
    # An observation: TypeScript and JavaScript have no dataflow graph yet,
    # so nothing proves where this value came from.
    kind: observation
    severity: high
    confidence: medium
    categories: [LLM10, ZT4]
    language: javascript
    any:
      - eval($ARG)
      - new Function($ARG)
    none:
      - eval("$LIT")
      - eval('$LIT')
      - new Function("$LIT")
      - new Function('$LIT')
    description: >
      eval() or the Function constructor is called with an argument that is
      not a string literal. Whatever produced this value -- a model reply, a
      planner's resolved template, a config file, a network response -- the
      moment its contents are attacker-influenceable this is arbitrary code
      execution, regardless of how many local variables separate the call
      from its original source.
    remediation: >
      Never execute anything but a fixed literal. If the agent needs to run
      model-suggested logic, parse it into a constrained, whitelisted set of
      operations (a small interpreter or a JSON tool-call schema) instead of
      eval/Function.

  - id: BAS-LLM10-006
    title: Model output executed as a shell command (JS)
    # An observation: TypeScript and JavaScript have no dataflow graph yet,
    # so nothing proves where this value came from.
    kind: observation
    severity: critical
    confidence: high
    categories: [LLM10]
    language: javascript
    # Two shapes share one ARG name so a single metavariable_matches gate
    # covers both: the plain-argument form (`exec(reply)`) and the
    # template-literal form (`exec(`...${reply}...`)`), each with and
    # without a `child_process`/aliased-import namespace prefix.
    #
    # Deliberately no bare `exec($ARG)` variant: `exec` alone collides with
    # `RegExp.prototype.exec` (`pattern.exec(reply)` is ordinary regex
    # parsing of a model reply, not shell execution), which would make this
    # rule fire on completely safe, common code. `execSync` carries no such
    # collision.
    #
    # The receiver on `$CP.exec(...)`/`$CP.execSync(...)` used to be a bare
    # metavariable (`$CP`), which this comment claimed was "scoped to a
    # child_process-shaped receiver" -- it was not: `$CP` matches *any*
    # identifier, so any object with an `.exec` method fired this rule.
    # Measured 2026-08-28: 18 of BAS-LLM10-006's findings (29% of all
    # findings in the calibration corpus) were exactly this -- 11
    # `pattern.exec(response)` (RegExp.prototype.exec) and 7
    # `db.exec(message)` (better-sqlite3's synchronous Database.exec), see
    # clean/near_misses.ts.
    #
    # The receiver is now the three names a `node:child_process` import is
    # realistically bound to (`cp`, `child_process`, `childProcess` -- the
    # namespace-import and CommonJS-require idioms), spelled out literally
    # rather than gated by a regex on a metavariable. A `metavariable_matches`
    # constraint on CP was tried and rejected: it is a single gate applied to
    # every pattern in this `any` list, and the two bare `execSync($ARG)`
    # patterns below never bind CP at all -- `metavariable_matches` fails
    # closed on a variable a pattern did not capture (see
    # `rules::engine::CompiledRule::metavariables_satisfied`), so a CP
    # constraint would have silently killed those two patterns' matches too.
    # Enumerating the receiver as literal identifiers avoids that trap
    # entirely, and also avoids the unanchored-regex-on-a-collapsed-call-chain
    # failure mode a metavariable gate risks: `$CP` can capture more than a
    # bare name (e.g. `require("child_process")`), and an unanchored regex
    # against that text can match a substring of an unrelated chain.
    any:
      - cp.exec($ARG)
      - cp.execSync($ARG)
      - child_process.exec($ARG)
      - child_process.execSync($ARG)
      - childProcess.exec($ARG)
      - childProcess.execSync($ARG)
      - execSync($ARG)
      - cp.exec(`$$$A${$ARG}$$$B`)
      - cp.execSync(`$$$A${$ARG}$$$B`)
      - child_process.exec(`$$$A${$ARG}$$$B`)
      - child_process.execSync(`$$$A${$ARG}$$$B`)
      - childProcess.exec(`$$$A${$ARG}$$$B`)
      - childProcess.execSync(`$$$A${$ARG}$$$B`)
      - execSync(`$$$A${$ARG}$$$B`)
    metavariable_matches:
      ARG: "(?i)(response|reply|completion|message|content|choices|output|generated)"
    description: >
      A value named like a model reply is passed straight to a shell via
      child_process.exec, execSync, or interpolated into a template-literal
      command string. If this value carries model output, anything the model
      was tricked into saying -- including output planted by content it read
      from the web or from a document -- runs as a shell command with the
      process's full privileges.
    remediation: >
      Do not derive shell commands from model output. If the agent must run
      a fixed set of commands, dispatch on a whitelist of command names with
      argv-array execFile/spawn calls and validated arguments -- never
      format model text into a command string.

  # Measured as non-firing on 2026-08-28, and deliberately kept *with its
  # name gate intact* — the one dead rule where widening was measured and
  # rejected. Across 65 real third-party AI repositories there are 26
  # template-literal `.query(`...`)` calls; 7 interpolate anything at all,
  # and all 7 interpolate a table *identifier* from configuration
  # (`${table}`), which is the one thing a bind parameter cannot carry and
  # therefore the legitimate reason to build a query by interpolation.
  # Dropping the ARG name gate the way BAS-LLM10-005 did would have turned
  # this rule from 0 findings into 7 false positives. The name gate is the
  # only thing making it precise, and it stays.
  - id: BAS-LLM10-007
    title: Model output concatenated into a SQL query (JS)
    # An observation: TypeScript and JavaScript have no dataflow graph yet,
    # so nothing proves where this value came from.
    kind: observation
    severity: critical
    confidence: high
    categories: [LLM10]
    language: javascript
    any:
      - $DB.query(`$$$A${$ARG}$$$B`)
    metavariable_matches:
      ARG: "(?i)(response|reply|completion|message|content|choices|output|generated)"
    description: >
      A database query is built by interpolating a value named like model
      output straight into a template-literal SQL string. If this value
      carries the model's reply, and that reply is attacker-influenceable
      (via prompt injection from any untrusted document, tool result, or
      user message it has seen), this is SQL injection with the model as
      the delivery mechanism.
    remediation: >
      Never interpolate model output into a SQL string. Use a parameterized
      query (db.query(sql, params)) and keep model output confined to
      parameter values, never to the query text itself.

  - id: BAS-ZT1-003
    title: Hardcoded API key (JS/TS)
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: javascript
    # Anchored on the string literal's own shape rather than an assignment
    # target, the same reasoning as BAS-ZT1-002 above: this fires wherever
    # the literal sits -- a `const`, an object-literal property value, a
    # function argument -- without needing a variant per surrounding shape.
    #
    # Reports through test paths for the same reason as BAS-ZT1-001.
    in_test_paths: report
    any:
      - '"$SECRET"'
      - "'$SECRET'"
    metavariable_matches:
      SECRET: "^sk-[A-Za-z0-9_-]{16,}$"
    # Measured 2026-08-28: 5 false positives, the sharpest being two
    # "leaked keys" flagged inside a function whose entire purpose was
    # *detecting* placeholder keys (an isPlaceholderKey()-shaped helper --
    # see clean/near_misses.ts). A placeholder value satisfies the length
    # gate above just as well as a real key does; the length/character-class
    # shape alone cannot tell them apart, so this is a second, narrower gate
    # on the placeholder *content* rather than a change to the shape gate.
    #
    # Deliberately does not touch `SECRET`'s own regex: a real key with real
    # entropy (vulnerable/zt1_static_credentials.ts) contains none of these
    # words and still fires, proving this is an exception for placeholders,
    # not a general weakening. Dummy fixture values also often spell out that
    # they are secret or must not leak; real keys are random and do not
    # contain those words.
    metavariable_not_matches:
      SECRET: "(?i)(test|example|placeholder|dummy|foo|secret|leak|changeme|your[-_]?key[-_]?here|local|xxx|0{8,}|1{8,})"
    description: >
      A provider API key is a literal in source rather than read from the
      environment or a secret manager. It ships with every clone of the
      repo, every log of the source, and every fork.
    remediation: >
      Load the key from an environment variable or secret manager
      (process.env.OPENAI_API_KEY) and rotate the key that leaked into
      history.

  - id: BAS-ZT4-003
    title: Raw user input folded directly into a template-literal system prompt (JS)
    # An observation: TypeScript and JavaScript have no dataflow graph yet,
    # so nothing proves where this value came from.
    kind: observation
    severity: high
    confidence: high
    categories: [LLM01, ZT4]
    language: javascript
    any:
      - "const $SYS = `$$$A${$VAR}$$$B`"
    metavariable_matches:
      SYS: "(?i)(system|prompt|instruction|persona|template)"
      VAR: "(?i)(user|request|query|input|raw|message)"
    none_in_file:
      - '{role: "user", content: $SYS}'
      - "{role: 'user', content: $SYS}"
      - '{content: $SYS, role: "user"}'
      - "{content: $SYS, role: 'user'}"
    description: >
      A system/instruction prompt is built by template-literal-interpolating
      a value named like user input directly into the instruction text, with
      no delimiter separating "what the model must do" from "what the user
      said." If this value carries user input, whoever controls it can
      rewrite the model's instructions.
    remediation: >
      Keep untrusted input out of the instruction channel. Pass it as a
      separate user/tool message, or through a templating layer that keeps
      it in a clearly delimited data slot the model is told to treat as
      content, not as commands.

  - id: BAS-LLM03-002
    title: Unauthorized agent tool exposed without a confirmation guard (JS)
    # An observation: the function's name is the only evidence that the tool
    # changes state, and a name is not proof.
    kind: observation
    severity: high
    confidence: medium
    categories: [LLM03]
    language: javascript
    # Matches the whole registration -- the binding *and* the tool({...})
    # call -- rather than the execute handler in isolation: ast-grep's JS
    # pattern matching parses a bare `execute: fn` snippet as a labeled
    # statement, not an object property, so it cannot be matched on its own
    # with plain Pattern::try_new (see engine.rs module docs for the
    # analogous TypeScript/Tsx divergence -- this is the same class of
    # surprise, a different grammar).
    #
    # Re-anchored on 2026-08-28. This rule used to require a `name: "..."`
    # property inside the tool({...}) object and never fired on any of 65
    # real third-party AI repositories. The reason is that the API it names
    # has no such property: the Vercel AI SDK's `tool()` helper takes
    # description/inputSchema/execute, and the tool's name comes from the
    # binding it is assigned to -- `const shutdownServer = tool({...})`, or a
    # property key in a tools object. Of the 122 `tool({` registrations in
    # that corpus, 100 are property keys and none are `const` bindings, so
    # the old pattern was not narrow, it was describing something that does
    # not exist.
    #
    # Read that measurement honestly: the shape this rule can now express is
    # the *minority* one, and the majority shape is the known gap below,
    # which ast-grep cannot express without matching approximately. This
    # re-anchor removes a requirement that could never be met; it does not
    # yet reach most real registries.
    #
    # Known gap, same trade as BAS-LLM03-001's guard-shape enumeration above:
    # `execute` must be the last property (no properties after it), and its
    # value must be an arrow function with a block body -- a registration
    # followed by more options (e.g. `timeout: ...`), or one whose execute is
    # a wrapped call, is missed rather than matched approximately. The
    # wrapped-call case is deliberate: a `requireConfirmation(...)` wrapper is
    # a real guard, and clean/tools.ts exists to prove it is not flagged.
    #
    # The other binding shape -- a property key in a tools object,
    # `purgeIncidentHistory: tool({...})` -- is a known gap, recorded in
    # tests/corpus/expected.toml. It is the same labeled-statement problem
    # described above and it cannot be worked around: `$NAME: tool({...})`
    # compiles without error and matches nothing (measured directly against
    # ast_grep_core), and the enclosing shapes that do match -- `return {
    # $$$A, $NAME: tool(...), $$$B }` and one variant per enclosing
    # construct -- report the enclosing statement's line rather than the
    # tool's, and only one tool per object. That is an approximate match, and
    # this file does not ship those.
    any:
      - "const $NAME = tool({ $$$PRE, execute: async ($$$P) => { $$$BODY } })"
      - "const $NAME = tool({ $$$PRE, execute: ($$$P) => { $$$BODY } })"
    none:
      - "const $NAME = tool({ $$$PRE, execute: async ($$$P) => { if (!$COND) { $$$_ } $$$REST } })"
      - "const $NAME = tool({ $$$PRE, execute: ($$$P) => { if (!$COND) { $$$_ } $$$REST } })"
      - "const $NAME = tool({ $$$PRE, execute: async ($$$P) => { if (!$COND) throw $EXC; $$$REST } })"
      - "const $NAME = tool({ $$$PRE, execute: ($$$P) => { if (!$COND) throw $EXC; $$$REST } })"
      - "const $NAME = tool({ $$$PRE, execute: async ($$$P) => { if (!$COND) return $EARLY; $$$REST } })"
      - "const $NAME = tool({ $$$PRE, execute: ($$$P) => { if (!$COND) return $EARLY; $$$REST } })"
    # Widened 2026-08-28, in parity with BAS-LLM03-001's Python widening --
    # see that rule's comment for the head-to-head benchmark measurement and
    # for why "add"/"set"/"pay"/"book" are deliberately absent (bare-prefix
    # collisions with address/settings/payload/bookmark).
    metavariable_matches:
      NAME: "(?i)^(delete|drop|remove|transfer|withdraw|wire|drain|revoke|terminate|shutdown|sell_all|liquidate|send_funds|execute_trade|purge|wipe|create|update|edit|modify|insert|cancel|approve|reject|install|uninstall|register|grant|subscribe|schedule|submit|publish|deploy|charge|refund|send)"
    description: >
      A tool registered with the agent SDK's tool() helper is named like a
      privileged or state-changing action (delete, transfer, create, update,
      ...) and its execute handler has no guard clause at the top checking a
      confirmation or authorization condition before acting. If the agent
      decides to call it, it executes unconditionally.
    remediation: >
      Require explicit confirmation or an authorization check before the
      tool acts: check a confirmed/approved flag (or re-verify authorization)
      as the first thing execute() does, and throw or return early when it is
      not satisfied.

  # ---------------------------------------------------------------------
  # LLM08 (JS/TS twin of BAS-LLM08-001). A secret baked into prompt text is
  # language-agnostic, so this reuses the exact sk--shaped value gate from
  # BAS-ZT1-003 rather than inventing a second definition of "looks like a
  # secret" -- one regex, two rules.
  #
  # ast-grep matches a `const $VAR = ...` pattern against the
  # `lexical_declaration` node inside an `export const ...` statement too
  # (measured directly: the pattern is not anchored to the top of the tree,
  # so `export` wrapping it does not defeat the match), which is the
  # ordinary way a real TS/JS codebase names a module-level prompt.
  # ---------------------------------------------------------------------

  - id: BAS-LLM08-002
    title: Secret embedded inside a prompt template (JS)
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM08]
    language: javascript
    any:
      - "const $VAR = \"$CONTENT\""
      - "const $VAR = '$CONTENT'"
      - "const $VAR = `$CONTENT`"
    metavariable_matches:
      VAR: "(?i)(prompt|template|system|instruction|persona)"
      CONTENT: "(?i)sk-[A-Za-z0-9_-]{16,}"
    description: >
      A credential-shaped secret is embedded in the text of a prompt or
      system-message template. Once a secret is part of what the model reads,
      it is part of what the model can be tricked into repeating -- a
      "don't reveal this" instruction is not a control the model reliably
      enforces.
    remediation: >
      Never put real secrets in prompt text, including as "internal only"
      instructions. Keep credentials out of the context window entirely; if
      the model needs to use a credential, do it via a tool call the
      application executes server-side.

  # ---------------------------------------------------------------------
  # LLM06 (JS/TS twin of BAS-LLM06-001). Observation, not a defect, for the
  # same reason as the Python rule: a gateway or SDK default elsewhere might
  # already bound the call, and the source alone cannot say. Loading
  # rejects a `kind: defect` on this context-dependent category outright,
  # so it stays here even though the shape is otherwise as certain as
  # BAS-ZT2-002 below.
  #
  # Three independent call shapes, one per SDK actually seen in 65 real
  # third-party AI repositories on 2026-08-28, each with its own ceiling
  # keyword: the Vercel AI SDK's generateText/streamText (maxOutputTokens),
  # the OpenAI Node SDK's chat.completions.create (max_tokens), and
  # LangChain.js's ChatOpenAI/ChatAnthropic constructors (maxTokens).
  #
  # No CLIENT/receiver name gate on the OpenAI-SDK shape, unlike the Python
  # rule's CLIENT: "(?i)(client|llm|openai|gpt)". That gate was measured
  # against this same corpus and would have missed a real call: a
  # middleware-wrapped client bound to a variable named `ai`, not
  # client/llm/openai/gpt-shaped. `.chat.completions.create` is already a
  # three-level attribute chain distinctive enough that no other capture
  # collided with it anywhere in the corpus, so the name gate bought
  # nothing but a miss.
  #
  # Each `none:` exclusion is written three ways -- ceiling property first,
  # last, and in the middle of the options object -- because ast-grep's
  # pattern matcher cannot express "this property is present anywhere in
  # the object" with a single `{ $$$A, prop: $V, $$$B }` pattern: when
  # `prop` is the object's last property (nothing for $$$B to capture and no
  # trailing comma for it to anchor on), that pattern silently fails to
  # match (measured directly against ast_grep_core; the same reason
  # BAS-LLM03-002 above requires `execute` to be the object's last
  # property). All three real ceiling positions were seen in this corpus --
  # last (this rule's own clean fixture), and the middle (two real repos,
  # `llm-gateway.ts` and `aiSdk.ts`) -- so only shipping the "last" variant,
  # the shape this file's own fixtures happened to use, would have missed
  # the majority of real code.
  # ---------------------------------------------------------------------

  - id: BAS-LLM06-002
    title: LLM call has no token ceiling (JS)
    kind: observation
    severity: low
    confidence: medium
    categories: [LLM06]
    language: javascript
    any:
      - generateText($$$ARGS)
      - streamText($$$ARGS)
      - $CLIENT.chat.completions.create($$$ARGS)
      - new ChatOpenAI($$$ARGS)
      - new ChatAnthropic($$$ARGS)
    none:
      - "generateText({ maxOutputTokens: $MT, $$$B })"
      - "generateText({ $$$A, maxOutputTokens: $MT })"
      - "generateText({ $$$A, maxOutputTokens: $MT, $$$B })"
      - "streamText({ maxOutputTokens: $MT, $$$B })"
      - "streamText({ $$$A, maxOutputTokens: $MT })"
      - "streamText({ $$$A, maxOutputTokens: $MT, $$$B })"
      - "$CLIENT.chat.completions.create({ max_tokens: $MT, $$$B })"
      - "$CLIENT.chat.completions.create({ $$$A, max_tokens: $MT })"
      - "$CLIENT.chat.completions.create({ $$$A, max_tokens: $MT, $$$B })"
      - "new ChatOpenAI({ maxTokens: $MT, $$$B })"
      - "new ChatOpenAI({ $$$A, maxTokens: $MT })"
      - "new ChatOpenAI({ $$$A, maxTokens: $MT, $$$B })"
      - "new ChatAnthropic({ maxTokens: $MT, $$$B })"
      - "new ChatAnthropic({ $$$A, maxTokens: $MT })"
      - "new ChatAnthropic({ $$$A, maxTokens: $MT, $$$B })"
    description: >
      This completion/generation call sets no explicit token ceiling
      (maxOutputTokens, max_tokens, or maxTokens depending on the SDK), so
      nothing in the repository bounds a single call's cost or latency. A
      gateway, proxy, or SDK default elsewhere may already cap this -- the
      source alone cannot say -- which is why this is an observation rather
      than a defect.
    remediation: >
      Set an explicit token ceiling on the call (or the provider's
      equivalent), or confirm and document the upstream limiter that bounds
      it.

  # ---------------------------------------------------------------------
  # ZT2 (JS/TS twin of BAS-ZT2-001). JS/TS has no keyword arguments, so
  # `allowed_tools="*"` has no direct equivalent: the ordinary shape a real
  # tool-scoping helper uses instead is a positional wildcard string, the
  # last argument to a call whose name says what it does --
  # `selectToolsForAgent(ALL_TOOLS, "*")` in this file's own vulnerable
  # fixture.
  #
  # This rule has now failed precision twice on the same root cause, and
  # the second failure is the one worth documenting in full because it
  # survived a grep-based measurement:
  #
  # Attempt 1: `$FN($$$PRE, "*")` with no gate on FN at all. Ungated, that
  # is not a wildcard-tool-grant pattern, it is "any call whose last
  # argument is the string *" -- a CORS header
  # (`res.header('Access-Control-Allow-Origin', '*')`), a glob, a route
  # wildcard.
  #
  # Attempt 2 (this rule's first shipped version) gated FN on
  # `(?i)(tool|agent)`, unanchored. That regex checks whether the
  # substring "tool" or "agent" appears anywhere in FN's captured text --
  # and FN, in ast-grep's pattern, captures the *entire* callee expression,
  # not just a bare function name. For a chained call like
  # `db.from("user_mcp_connector_tools").select("*")`, the callee is the
  # whole `db.from("user_mcp_connector_tools").select` expression, and its
  # text contains "tool" -- not from a function name, from a table-name
  # string literal three calls upstream of the actual `.select("*")`.
  # Measured directly against the 65-repo corpus after Attempt 2 shipped:
  # 7 findings, 0 true positives, all Supabase/PostgREST
  # `.from(TABLE).select("*")` chains where a table name happened to
  # contain "tool" or "agent" as a substring. A prior grep-based check for
  # this exact shape (matching a dotted identifier immediately before the
  # call, comma-separated arguments only) reported zero hits and was
  # wrong: it could not model ast-grep collapsing an entire multi-call
  # chain's text -- string-literal arguments included -- into one
  # metavariable, and it never tried the single-argument `$FN("*")` case
  # (`$$$PRE` matching zero nodes) at all. Lesson: a grep proxy for an
  # ast-grep pattern is not a measurement of that pattern; only running the
  # compiled rule against real code is.
  #
  # The fix anchors FN's regex to the *entire* captured text
  # (`^...$`, identifier characters only): a plain identifier callee like
  # `selectToolsForAgent` satisfies it, but a member-expression chain like
  # `db.from("user_mcp_connector_tools").select` never can, because it
  # contains characters (`.`, `"`, `(`, `)`) no identifier does. That also
  # narrows recall to bare-identifier calls only (no `sdk.selectTools(...)`
  # namespaced form), which costs nothing measured: the corpus fixture this
  # rule exists to catch is itself a bare identifier call, and there is
  # still no real-world instance of any wildcard-tool-grant shape to have
  # widened for.
  # ---------------------------------------------------------------------

  - id: BAS-ZT2-002
    title: Wildcard tool grant in agent-construction code (JS)
    kind: defect
    severity: high
    confidence: high
    categories: [ZT2]
    language: javascript
    any:
      - '$FN($$$PRE, "*")'
      - "$FN($$$PRE, '*')"
    metavariable_matches:
      FN: "(?i)^[a-z_$][a-z0-9_$]*(tool|agent)[a-z0-9_$]*$"
    description: >
      An agent is constructed with a wildcard tool grant, positionally
      rather than as a named keyword argument -- the ordinary call shape in
      TS/JS -- granting every tool registered on it, present and future,
      rather than the specific handful the task actually needs. A new
      destructive tool added later is trusted automatically, with no review
      of this wiring.
    remediation: >
      Replace the wildcard with an explicit list of the tool names this
      agent actually needs. Review that list whenever a new tool is added to
      the pool it draws from.
