# Hardcoded credentials, provider keys, and secret-shaped literals in source.
#
# Part of the built-in rule corpus, loaded alongside bastyn.yml and the other
# rules/*.yml files by RuleSet::embedded(). The corpus is split by subject so
# that unrelated rules can be authored without contending for one file; ids
# are still globally unique across every file.
#
# Schema: see the header of bastyn.yml.
#
# Scope note: BAS-INFRA-002/BAS-INFRA-006 already own hardcoded credentials
# in Dockerfile/Compose deployment config -- nothing here duplicates that
# surface. Every rule below is about a credential literal in application
# source (Python/JS/TS).

rules:
  # ---------------------------------------------------------------------
  # LLM02.1 -- an LLM provider SDK client constructed with the key passed
  # as a literal argument, rather than an assignment. BAS-ZT1-001/003 (in
  # bastyn.yml) already anchor on `$VAR = "sk-..."` -- a prior assignment --
  # so they miss the equally common inline-construction shape
  # (`OpenAI(api_key="sk-...")`), where the string is a call/object argument
  # and never sits on the left of an `=`. Same `sk-` shape and same
  # placeholder exclusion as those rules (proven precise there, see
  # BAS-ZT1-003's own measurement note in bastyn.yml), applied at a call
  # site instead of an assignment site.
  # ---------------------------------------------------------------------

  - id: BAS-LLM02-001
    title: LLM provider API key passed as a literal to the client constructor
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM02, ZT1]
    language: python
    # A live provider key is leaked wherever it sits, including a fixture --
    # same reasoning as BAS-ZT1-001.
    in_test_paths: report
    any:
      - "$CLIENT($$$A, api_key=\"$SECRET\", $$$B)"
      - "$CLIENT(api_key=\"$SECRET\", $$$B)"
      - "$CLIENT($$$A, api_key=\"$SECRET\")"
      - "$CLIENT($$$A, api_key='$SECRET', $$$B)"
      - "$CLIENT(api_key='$SECRET', $$$B)"
      - "$CLIENT($$$A, api_key='$SECRET')"
    metavariable_matches:
      SECRET: "^sk-[A-Za-z0-9_-]{16,}$"
    # Same placeholder gate as BAS-ZT1-003's JS/TS twin: the sk- shape and
    # length alone cannot tell a real key from a value a placeholder-
    # detecting helper uses to exercise itself.
    metavariable_not_matches:
      SECRET: "(?i)(test|example|placeholder|dummy|foo|changeme|your[-_]?key[-_]?here|local|xxx|0{8,}|1{8,})"
    description: >
      An LLM provider SDK client is constructed with api_key set to a
      literal key rather than a value read from the environment or a
      secret manager. It ships with every clone of the repo, every log of
      the source, and every fork.
    remediation: >
      Read the key from an environment variable or secret manager
      (os.environ["OPENAI_API_KEY"]) and pass that in, then rotate the key
      that leaked into history.

  - id: BAS-LLM02-002
    title: LLM provider API key passed as a literal to the client constructor (JS/TS)
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM02, ZT1]
    language: javascript
    in_test_paths: report
    any:
      - "new $CLIENT({ $$$A, apiKey: \"$SECRET\", $$$B })"
      - "new $CLIENT({ apiKey: \"$SECRET\", $$$B })"
      - "new $CLIENT({ $$$A, apiKey: \"$SECRET\" })"
      - "new $CLIENT({ $$$A, apiKey: '$SECRET', $$$B })"
      - "new $CLIENT({ apiKey: '$SECRET', $$$B })"
      - "new $CLIENT({ $$$A, apiKey: '$SECRET' })"
      - "$CLIENT({ $$$A, apiKey: \"$SECRET\", $$$B })"
      - "$CLIENT({ apiKey: \"$SECRET\", $$$B })"
      - "$CLIENT({ $$$A, apiKey: \"$SECRET\" })"
      - "$CLIENT({ $$$A, apiKey: '$SECRET', $$$B })"
      - "$CLIENT({ apiKey: '$SECRET', $$$B })"
      - "$CLIENT({ $$$A, apiKey: '$SECRET' })"
    metavariable_matches:
      SECRET: "^sk-[A-Za-z0-9_-]{16,}$"
    metavariable_not_matches:
      SECRET: "(?i)(test|example|placeholder|dummy|foo|changeme|your[-_]?key[-_]?here|local|xxx|0{8,}|1{8,})"
    description: >
      An LLM provider SDK client is constructed with apiKey set to a
      literal key rather than a value read from the environment or a
      secret manager. It ships with every clone of the repo, every log of
      the source, and every fork.
    remediation: >
      Read the key from an environment variable or secret manager
      (process.env.OPENAI_API_KEY) and pass that in, then rotate the key
      that leaked into history.

  # ---------------------------------------------------------------------
  # LLM02.3 -- considered and dropped. The catalogue's shape is a function
  # registered as an MCP tool returning a dict literal whose keys include a
  # credential-shaped name (`return {"db_host": host, "api_key": API_KEY}`).
  # That needs a pattern of the form `return { $$$A, "$KEY": $V, $$$B }` --
  # a variadic capture on either side of the target pair inside a Python
  # dictionary literal -- and that shape does not match at all against
  # ast-grep-core 0.45.2's Python grammar, in any position (first, middle,
  # last) and with either a metavariable or a fixed literal key, measured
  # directly: `Pattern::try_new` compiles it without error, but
  # `node.find_all` returns nothing against a real multi-entry dict. Only
  # the degenerate single-entry case (`return {"$KEY": $V}`, nothing else in
  # the dict) matches -- confirmed directly against ast_grep_core, the same
  # way BAS-LLM03-002's "known gap" comment in bastyn.yml was confirmed.
  # A rule that can only fire when a tool's entire return value is one
  # credential is narrower than the catalogue's own example and was judged
  # not worth shipping on its own. See BAS-ZT1-010 below for the identical
  # limitation and the same resolution (single-entry dicts only).
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # LLM02.4 -- a live bearer token embedded as a literal, most often built
  # into an Authorization header. Anchored on the string literal's own
  # shape ("Bearer <token>"), not on any particular variable name or
  # surrounding file, the same technique BAS-ZT1-002 in bastyn.yml uses for
  # connection-string credentials: it fires wherever the literal sits. An
  # f-string/template-literal interpolation (`f"Bearer {token}"`,
  # `` `Bearer ${token}` ``) is a structurally different node (composed of
  # text segments and an interpolation, not one plain string token) and
  # does not match a plain-string pattern, so it is excluded by
  # construction rather than by an extra guard.
  #
  # Measured 2026-08-31: a plain (non-f-string) literal whose *content* is
  # itself unexpanded template syntax -- `"Bearer {{env.DAST_AUTH_TOKEN}}"`,
  # substituted by the application's own templating layer at execution
  # time, not by Python. That does match a plain-string pattern (it has no
  # interpolation node), so it needs the explicit guard below rather than
  # being excluded by construction. Same judgment `credential::
  # is_hardcoded_credential_value` already applies to a leading `{{` or `$`.
  # ---------------------------------------------------------------------

  - id: BAS-LLM02-004
    title: Hardcoded bearer token in tool/skill implementation code
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM02, ZT1]
    language: python
    any:
      - '"$VALUE"'
    metavariable_matches:
      VALUE: '(?i)^bearer\s+\S{16,}$'
    metavariable_not_matches:
      VALUE: "(?i)(test|example|placeholder|dummy|changeme|your[-_]?token|xxx|0{8,}|1{8,})|\\{\\{|bearer\\s+\\$"
    description: >
      A string literal is a live-looking "Bearer <token>" value, most often
      built into an Authorization header. A token embedded this way ships
      with every clone of the repo, every log of the source, and every
      fork.
    remediation: >
      Read the token from an environment variable or secret manager and
      build the header from that at request time, then rotate the token
      that leaked into history.

  - id: BAS-LLM02-005
    title: Hardcoded bearer token in tool/skill implementation code (JS/TS)
    kind: defect
    severity: critical
    confidence: high
    categories: [LLM02, ZT1]
    language: javascript
    any:
      - '"$VALUE"'
      - "'$VALUE'"
    metavariable_matches:
      VALUE: '(?i)^bearer\s+\S{16,}$'
    metavariable_not_matches:
      VALUE: "(?i)(test|example|placeholder|dummy|changeme|your[-_]?token|xxx|0{8,}|1{8,})|\\{\\{|bearer\\s+\\$"
    description: >
      A string literal is a live-looking "Bearer <token>" value, most often
      built into an Authorization header. A token embedded this way ships
      with every clone of the repo, every log of the source, and every
      fork.
    remediation: >
      Read the token from an environment variable or secret manager and
      build the header from that at request time, then rotate the token
      that leaked into history.

  # ---------------------------------------------------------------------
  # Generic API key literal -- not in the catalogue, carried over from a
  # prototype tool. The highest-volume, highest-false-positive-risk rule in
  # this file: a credential-shaped variable or dict key holding a string
  # literal with real entropy. Reuses crate::credential's placeholder
  # judgment (${VAR}/$VAR, empty, changeme/xxx/..., a file path, a value
  # that spells out a length requirement, a SCREAMING_SNAKE_CASE value that
  # is itself an env-var name) rather than reinventing it -- see that
  # module's doc comment for why this can only be a hand-checked
  # translation rather than a shared call, and
  # `generic_credential_rule_agrees_with_credential_module_on_placeholders`
  # in tests_secrets.rs for the check that the two do not drift apart.
  #
  # One addition beyond credential.rs's own exclusions, motivated by this
  # rule's much broader surface (arbitrary application source, not
  # deployment config): a VALUE containing whitespace is excluded outright.
  # A real secret is practically always one unbroken token; a value with a
  # space in it is prose -- most often a UI label or error message sitting
  # on a variable that merely *mentions* a credential
  # (`password_prompt = "Please enter your password"`), which is the
  # single largest false-positive shape a bare credential-named-key gate
  # produces on real code.
  #
  # Measured 2026-08-28 against 65 real repositories: the first pass (the
  # whitespace exclusion above, plus credential.rs's own list) still scored
  # roughly 9% precision on the reported (non-test-path) findings -- 5 true
  # positives out of 58. Every one of the 53 false positives shared a
  # second shape the whitespace rule does not touch: a VALUE that is a
  # human-typed identifier, not a generated secret -- pure lowercase
  # letters and separators, no digit, no uppercase. It covers three
  # distinct real shapes found in the corpus: a self-referential storage/
  # cookie/header *name* sitting on a `*_TOKEN`/`*_KEY`-named constant
  # (`const TOKEN_NAME = "owly-token"`, `PRIVY_TOKEN_COOKIE = 'privy-token'`),
  # a vendored/bundled library's own unrelated use of "key" (Bootstrap.js's
  # `const DATA_API_KEY = '.data-api'`, a CSS selector, duplicated across
  # every bundle format in the tree), and an NLP/format token that has
  # nothing to do with authentication (`MaxNewTokens = "max_new_tokens"`,
  # `DATE_FORMAT_TOKENS = "%Y-%m-%d"`) -- the word "token" is exceptionally
  # overloaded in an AI codebase specifically. `^[^0-9A-Z]+$` (no digit,
  # no uppercase letter, anywhere in the value) excludes all of these at
  # once and did not cost a single one of the 5 true positives, every one
  # of which contains a digit. `^[A-Z][a-z]+$` catches the one remaining
  # shape that gate cannot -- a single title-case English word
  # (`header_mapping = {"token": "Authorization"}`). The word-marker list
  # grew too (test/example/placeholder/dummy/fixture/demo/sample/fake/
  # mock/smoke/foo): one repository's "smoke test" fixtures
  # (`secret = "acme-smoke-secret-v1"`) contain a digit and survive the
  # entropy gate, so only the word itself catches them.
  #
  # Re-measured on the tightened rule: precision on reported (non-test-path)
  # findings rose from roughly 9% to 71% (5 true positives of 7). The one
  # remaining false-positive shape needing a second pass: `%[A-Za-z]`
  # excludes a strftime/format-token string (`DATE_FORMAT_TOKENS =
  # "%Y-%m-%d"`) -- the value's own uppercase `Y` defeated the no-digit/
  # no-uppercase gate above, and it is not any of the placeholder words
  # either. With that fix, precision is 5/6 (83%). The one accepted
  # residual false positive (`sign_secret = "acme-signing-secret-v2"`)
  # is a repository whose test/demo fixtures spell out real-looking secret
  # names outside any path `test_path.rs` recognises as a test path
  # (`src/<module>_runtime/`, not `tests/`); it carries a digit and no
  # placeholder word, so nothing here catches it without also excluding
  # values that legitimately contain the word "secret" -- BAS-ZT1-002 in
  # bastyn.yml already rejected that trade for the same reason (see its
  # own comment: "a real finding that contains the word SECRET").
  #
  # Python's dict-literal patterns below cover only a single-entry dict
  # (`{"$KEY": "$VALUE"}`, nothing else in it) -- see LLM02.3's
  # "considered and dropped" comment above for the measurement: any pattern
  # combining a variadic ($$$A/$$$B) capture with a credential-shaped pair
  # inside a Python dictionary literal does not match at all against
  # ast-grep-core 0.45.2's Python grammar, in any position. A multi-entry
  # dict whose credential key is not the dict's only entry is a known,
  # engine-limited gap for the Python assignment form; the JS/TS twin below
  # does not share this limitation (object-literal variadic matching is
  # proven working elsewhere in this rule set, e.g. BAS-LLM06-002 in
  # bastyn.yml) and keeps its 3-position object-literal coverage.
  # ---------------------------------------------------------------------

  # A plain http(s) URL (no `@`, `?`, `#`, `=` or `;`) is excused as an
  # endpoint. Known limit: a token embedded in the URL path (for example a
  # webhook path segment) is not reported.
  - id: BAS-ZT1-010
    title: Hardcoded credential-shaped literal
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: python
    any:
      - "$KEY = \"$VALUE\""
      - "$KEY = '$VALUE'"
      - "{ \"$KEY\": \"$VALUE\" }"
      - "{ '$KEY': '$VALUE' }"
    metavariable_matches:
      KEY: "(?i)(password|passwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret)"
      VALUE: "^.{8,}$"
    metavariable_not_matches:
      VALUE: '\s|^\$|^\{\{|^<.*>$|^/|^\./|^\.\./|^~/|^https?://[^\s@?#=;]*$|%[A-Za-z]|^phc_|^pk_live_|^pk_test_|^(?i:true|false|yes|no|on|off)$|^[0-9]+$|^[A-Z0-9_]+$|^[^0-9A-Z]+$|^[A-Z][a-z]+$|(?i:changeme|change_me|change-me|your_password|your-password|yourpassword|insert_your|insert-your|replace_with|replace-with|xxx|todo|fixme|example\.com|at-least|at_least|minimum|characters-long|chars-long|test|example|placeholder|dummy|fixture|demo|sample|fake|mock|smoke|foo|redacted|scrubbed|masked)'
    description: >
      A variable or dict key whose name is credential-shaped (password,
      secret, token, api_key, ...) is assigned a string literal with real
      entropy, rather than a value read from the environment or a secret
      manager.
    remediation: >
      Read the value from an environment variable or secret manager instead
      of hardcoding it, then rotate the credential that leaked into
      history.

  - id: BAS-ZT1-011
    title: Hardcoded credential-shaped literal (JS/TS)
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: javascript
    any:
      - "const $KEY = \"$VALUE\""
      - "const $KEY = '$VALUE'"
      - "let $KEY = \"$VALUE\""
      - "let $KEY = '$VALUE'"
      - "var $KEY = \"$VALUE\""
      - "var $KEY = '$VALUE'"
      - "const $OBJ = { $$$A, $KEY: \"$VALUE\", $$$B }"
      - "const $OBJ = { $KEY: \"$VALUE\", $$$B }"
      - "const $OBJ = { $$$A, $KEY: \"$VALUE\" }"
      - "const $OBJ = { $$$A, $KEY: '$VALUE', $$$B }"
      - "const $OBJ = { $KEY: '$VALUE', $$$B }"
      - "const $OBJ = { $$$A, $KEY: '$VALUE' }"
    metavariable_matches:
      KEY: "(?i)(password|passwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret)"
      VALUE: "^.{8,}$"
    # `__Host-` and `__Secure-` are the reserved cookie-name prefixes, so a
    # literal starting with one is a cookie name, not a secret.
    metavariable_not_matches:
      VALUE: '\s|^\$|^\{\{|^<.*>$|^/|^\./|^\.\./|^~/|^__(Host|Secure)-|^https?://[^\s@?#=;]*$|%[A-Za-z]|^phc_|^pk_live_|^pk_test_|^(?i:true|false|yes|no|on|off)$|^[0-9]+$|^[A-Z0-9_]+$|^[^0-9A-Z]+$|^[A-Z][a-z]+$|(?i:changeme|change_me|change-me|your_password|your-password|yourpassword|insert_your|insert-your|replace_with|replace-with|xxx|todo|fixme|example\.com|at-least|at_least|minimum|characters-long|chars-long|test|example|placeholder|dummy|fixture|demo|sample|fake|mock|smoke|foo|redacted|scrubbed|masked)'
    description: >
      A variable or object key whose name is credential-shaped (password,
      secret, token, apiKey, ...) is assigned a string literal with real
      entropy, rather than a value read from the environment or a secret
      manager.
    remediation: >
      Read the value from an environment variable or secret manager instead
      of hardcoding it, then rotate the credential that leaked into
      history.

  # ---------------------------------------------------------------------
  # ZT1.10 -- a seed/init script creates a default admin account with a
  # literal weak password. Marked `medium` precision risk in the
  # catalogue: gated on two independent signals kept deliberately narrow --
  # an account-creation-shaped function name, and a password value from a
  # small, explicit dictionary of well-known weak/default passwords --
  # rather than trying to judge password strength generally. A strong
  # random password passed the same way is not flagged here (it is a
  # secret-in-code problem, not a *weak-default* problem, and outside a
  # call-kwarg shape BAS-ZT1-010/011 do not reach it either -- an accepted,
  # documented gap rather than a guess at entropy).
  # ---------------------------------------------------------------------

  - id: BAS-ZT1-012
    title: Weak or default admin password seeded in a setup or init script
    kind: defect
    severity: high
    confidence: medium
    categories: [ZT1]
    language: python
    any:
      - "$FN($$$A, password=\"$VALUE\", $$$B)"
      - "$FN(password=\"$VALUE\", $$$B)"
      - "$FN($$$A, password=\"$VALUE\")"
      - "$FN($$$A, password='$VALUE', $$$B)"
      - "$FN(password='$VALUE', $$$B)"
      - "$FN($$$A, password='$VALUE')"
    metavariable_matches:
      FN: "(?i)(create_user|create_admin|create_superuser|createuser|createadmin|createsuperuser|seed_admin|seed_user|register_user|set_password|reset_password|init_admin|bootstrap_admin|add_user|new_user)"
      VALUE: '(?i)^(changeme[0-9]*|change_me|password[0-9]*|admin(123)?|letmein|123456789?|12345678|qwerty[0-9]*|welcome[0-9]*|root|toor|test1234|default|temp1234|pass1234|passw0rd!?|p@ssw0rd!?)$'
    description: >
      A function whose name looks like it seeds a user or admin account is
      called with password set to a well-known weak or default value. If
      this script runs unmodified against a real deployment, the account it
      creates is trivially guessable from day one.
    remediation: >
      Generate a random password at seed time and require it to be changed
      on first login, or read the seed password from an environment
      variable/secret manager rather than hardcoding a default.

  - id: BAS-ZT1-013
    title: Weak or default admin password seeded in a setup or init script (JS/TS)
    kind: defect
    severity: high
    confidence: medium
    categories: [ZT1]
    language: javascript
    any:
      - "$FN({ $$$A, password: \"$VALUE\", $$$B })"
      - "$FN({ password: \"$VALUE\", $$$B })"
      - "$FN({ $$$A, password: \"$VALUE\" })"
      - "$FN({ $$$A, password: '$VALUE', $$$B })"
      - "$FN({ password: '$VALUE', $$$B })"
      - "$FN({ $$$A, password: '$VALUE' })"
    metavariable_matches:
      FN: "(?i)(create_?user|create_?admin|create_?superuser|seed_?admin|seed_?user|register_?user|set_?password|reset_?password|init_?admin|bootstrap_?admin|add_?user|new_?user)"
      VALUE: '(?i)^(changeme[0-9]*|change_me|password[0-9]*|admin(123)?|letmein|123456789?|12345678|qwerty[0-9]*|welcome[0-9]*|root|toor|test1234|default|temp1234|pass1234|passw0rd!?|p@ssw0rd!?)$'
    description: >
      A function whose name looks like it seeds a user or admin account is
      called with password set to a well-known weak or default value. If
      this script runs unmodified against a real deployment, the account it
      creates is trivially guessable from day one.
    remediation: >
      Generate a random password at seed time and require it to be changed
      on first login, or read the seed password from an environment
      variable/secret manager rather than hardcoding a default.

  # ---------------------------------------------------------------------
  # ZT1 — a string literal has the exact three-segment shape of a JSON
  # Web Token. Unlike BAS-ZT1-010/011's name-gated credential rule, this
  # needs no variable/key name at all: the eyJ... shape alone is
  # essentially unique to a JWT in real code.
  # ---------------------------------------------------------------------

  - id: BAS-ZT1-018
    title: Hardcoded JWT literal
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: python
    any:
      - '"$VALUE"'
      - "'$VALUE'"
    metavariable_matches:
      VALUE: '^eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*$'
    description: >
      A string literal has the three-segment, base64url-encoded shape of
      a JSON Web Token (header.payload.signature, header segment starting
      "eyJ"). A JWT embedded in source ships with every clone, log, and
      fork of the repository, and unlike a rotated runtime secret its
      claims (subject, role, expiry) are permanently readable by anyone
      who has the source.
    remediation: >
      Never hardcode a JWT. Issue and store tokens at runtime, read them
      from an environment variable or secret manager, and rotate whatever
      leaked into history.

  # ---------------------------------------------------------------------
  # ZT1 — a string literal matches AWS's own access-key-ID format
  # exactly. Unique enough to be AWS's own primary credential-scanner
  # signal, so this needs no surrounding key name either.
  # ---------------------------------------------------------------------

  - id: BAS-ZT1-019
    title: Hardcoded AWS access key ID
    kind: defect
    severity: critical
    confidence: high
    categories: [ZT1]
    language: python
    any:
      - '"$VALUE"'
      - "'$VALUE'"
    metavariable_matches:
      VALUE: '^(AKIA|ASIA)[0-9A-Z]{16}$'
    metavariable_not_matches:
      # AWS's own official placeholder access key ID, published in AWS's own
      # documentation, SDK examples, and countless tutorials outside test
      # paths -- a well-known false-positive trigger, not a real credential.
      VALUE: '^AKIAIOSFODNN7EXAMPLE$'
    description: >
      A string literal matches AWS's own access-key-ID format exactly
      (AKIA/ASIA followed by 16 uppercase alphanumeric characters). A
      hardcoded access key ID is almost always paired with its secret
      key nearby and grants direct access to the account's AWS
      resources.
    remediation: >
      Never hardcode AWS credentials. Use an IAM role, an environment
      variable, or a secret manager, and rotate the key pair that leaked
      into history.

  # ---------------------------------------------------------------------
  # ZT1 — os.environ.get()/os.getenv() given a real default value for a
  # credential-shaped variable name. BAS-ZT1-010/011 only anchor on a
  # direct `$KEY = "$VALUE"` assignment or a dict-literal value; this is
  # neither -- the secret sits as the *default argument* of an
  # environment lookup, which reads as "safely reading from the
  # environment" at a glance even though every deployment that forgets
  # to set the variable silently gets this literal instead. Reuses
  # BAS-ZT1-010's VALUE placeholder-exclusion list.
  # ---------------------------------------------------------------------

  - id: BAS-ZT1-020
    title: Credential-shaped default value read from an environment variable
    kind: defect
    severity: high
    confidence: medium
    categories: [ZT1]
    language: python
    any:
      - 'os.environ.get("$KEY", "$VALUE")'
      - "os.environ.get('$KEY', '$VALUE')"
      - 'os.getenv("$KEY", "$VALUE")'
      - "os.getenv('$KEY', '$VALUE')"
    metavariable_matches:
      KEY: "(?i)(password|passwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret)"
      VALUE: "^.{8,}$"
    metavariable_not_matches:
      VALUE: '\s|^\$|^\{\{|^<.*>$|^(?i:true|false|yes|no|on|off)$|^[0-9]+$|^[A-Z0-9_]+$|^[^0-9A-Z]+$|^[A-Z][a-z]+$|(?i:changeme|change_me|change-me|your_password|xxx|todo|fixme|test|example|placeholder|dummy|fixture|demo|sample|fake|mock|smoke|foo|redacted|scrubbed|masked)'
    description: >
      os.environ.get()/os.getenv() is called with a credential-shaped
      variable name and a second-argument default that has real entropy
      rather than being empty or an obvious placeholder. If the
      environment variable is never actually set -- the common case for
      an optional-looking default -- every deployment silently falls
      back to this literal password/token/key.
    remediation: >
      Never give a credential-shaped environment lookup a real default
      value. Fail closed (raise, or default to None and reject startup)
      when the variable is unset, so a missing secret is loud instead of
      silently substituted.
