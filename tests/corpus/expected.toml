# vulnerable/dotenv_leak/.env and clean/dotenv_example/.env.example exist as
# fixtures (see README.md-style live-reproduction commands in the dotenv
# analyser's own PR/task notes) but carry no [[expect]]/[[expect_none]] entry
# here, deliberately: walk.rs's own doc comment scopes the .env/.env.*
# always-walk allowlist to "the scan root" -- collect_files's allowlist pass
# only looks one level below whatever root it is handed. This corpus's own
# gate (see this file's header comment and corpus_gate.rs's module doc)
# scans `tests/corpus` exactly once, as a single root, so a .env file nested
# two levels below it (vulnerable/dotenv_leak/.env) is not a hidden dotfile
# at *that* scan's root and is therefore never walked in this gate at all --
# not found, not skipped, invisible -- regardless of whether dotenv.rs
# detects it correctly. Confirmed directly: scanning tests/corpus as a whole
# produces zero findings and zero skipped entries mentioning either fixture.
# This is a reachability limit of running one shared corpus scan over many
# independent fixture directories, not a detection gap in BAS-ZT1-021/022,
# so recording it as [[known_gap]] would misattribute a harness limitation
# as a rule weakness. The actual regression coverage for "is .env wired into
# scan()" lives in crates/bastyn-core/src/scan.rs's own test module
# (dot_env_credentials_are_analysed_by_the_scan and its .env.example sibling)
# and crates/bastyn-core/src/dotenv.rs's own unit tests, both of which scan a
# tree with .env genuinely at its root, matching walk.rs's real allowlist
# scope. These two fixture directories remain in the corpus tree purely as a
# hand-runnable reproduction of the original bug report (`cargo run
# --release -p bastyn -- tests/corpus/vulnerable/dotenv_leak`).
#
# clean/dotenv_multi_segment_example/.env.local.example and
# clean/dotenv_placeholder_value/.env are the same kind of fixture, added for
# a later false-positive report against BAS-ZT1-021/022: (1) a per-environment
# example file (`.env.local.example`) that a placeholder-suffix check used to
# miss because it checked the whole remainder after ".env." rather than just
# the final segment, and (2) a genuine, non-example `.env` holding an obvious
# placeholder value (`sk-your-key-here-...`, `sk-REPLACE_WITH_YOUR_...`) that
# `is_provider_key_literal` used to accept on shape alone. Both are two levels
# below this corpus's single scan root, so the same reachability limit above
# applies and neither carries an [[expect_none]] entry here. The real
# regression coverage lives in crates/bastyn-core/src/dotenv.rs's own unit
# tests (a_multi_segment_placeholder_suffix_file_is_never_flagged,
# a_placeholder_shaped_value_in_a_genuine_env_file_is_not_flagged) and
# crates/bastyn-core/src/credential.rs's own unit tests
# (a_provider_key_shaped_placeholder_is_not_reported). Hand-runnable
# reproduction: `cargo run --release -p bastyn -- scan
# tests/corpus/clean/dotenv_multi_segment_example` /
# `tests/corpus/clean/dotenv_placeholder_value`.

