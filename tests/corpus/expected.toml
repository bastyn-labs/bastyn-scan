[[known_gap]]
file     = "vulnerable/real_misses/shell_command_via_chained_tool_forward.py"
line     = 25
category = "LLM10"
why      = "_inner()'s cmd is forwarded from run() (an @mcp.tool() entry point) through _outer() -- two hops, not the one hop collect_entry_point_forwards checks for. flow.passthrough_downgrade wrongly reports this as an observation instead of a defect. The same bounded-depth precedent FlowGraph::wrapper_sink_parameters's own doc comment already accepts for the sink side (\"a wrapper around a wrapper is out of reach by construction, not merely untested\") applies here on the entry-point-forwarding side; extending it to arbitrary-depth call chains is out of this check's scope."

[[known_gap]]
file     = "vulnerable/real_misses/shell_command_via_thread_pool_forward.py"
line     = 26
category = "LLM10"
why      = "_exec()'s cmd is forwarded from run() (an @mcp.tool() entry point) through asyncio.to_thread(_exec, cmd) -- a callee shape collect_entry_point_forwards does not recognize (only a bare NAME(...) call or a self/cls-qualified NAME(...) call are). flow.passthrough_downgrade wrongly reports this as an observation instead of a defect. The space of ways Python code can pass a callable and its argument along (thread pools, unbound-method calls, super() calls, decorator registries, dict-of-callables dispatch, ...) is genuinely open-ended; this is one representative shape, not exhaustive -- see bastyn.yml's comment for the others, which fail identically for the identical reason."

