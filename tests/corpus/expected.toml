# The specification of what Bastyn should find. See FORMAT.md.
#
# Written from real failure modes measured against a production agentic app
# (see tests/corpus/README.md), not from the rules themselves — a corpus
# derived from the rules only proves a rule matches its own fixture, which
# is how the tool that inspired this repo shipped at 20% recall.
#
# Every [[expect]], [[known_gap]], and [[known_false_positive]] entry below
# was checked against the scanner built from this commit
# (`cargo build --release`) before being recorded, per FORMAT.md's contract.
# See README.md for the full reconciliation and the measured recall.
#
# Observation-kind entries (kind = "observation") only appear in the
# default report with --show-observations; the harness must pass that
# flag when checking this manifest, or run twice (once for defects, once
# with --show-observations for the rest).
#
# CVE-based findings (BAS-CVE-001, category LLM04) require live network
# access to OSV.dev. `--offline` — the mode this corpus is verified against
# — makes zero network calls by design (CveStatus::SkippedOffline) and
# therefore produces zero CVE findings no matter what is pinned. The LLM04
# entries below are recorded as known_gap for that reason: not because the
# capability doesn't exist, but because it is unreachable in the verified
# mode. If the release gate runs online, those four entries are the first
# candidates to promote to [[expect]] — see FORMAT.md on how a known_gap is
# retired.

# =====================================================================
# vulnerable/ — one realistic instance per detectable category
# =====================================================================

