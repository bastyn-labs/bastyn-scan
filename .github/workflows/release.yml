name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A tag is not a promise that the code works. Prove it before publishing
  # anything a user can download.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked
      - name: Check the tag matches the crate version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "bastyn") | .version')"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match crate version ${version}"
            exit 1
          fi
      - name: Check the action installs the binary from this release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # action.yml's `version` default is what a caller gets when they do
          # not name one. If it lags the tag, then pinning the action to an
          # exact version still installs some other release's binary, which
          # is the opposite of what pinning is for.
          # Read it with awk rather than yq: the Ubuntu runner image ships
          # jq but not yq, so a yq here would fail the first release to run it.
          default="$(awk '/^  version:/{f=1} f && /^    default:/{print $2; exit}' action.yml)"
          if [ "$default" != "$TAG" ]; then
            echo "::error::action.yml installs ${default} but this release is ${TAG}; update the default"
            exit 1
          fi
      - name: Check action.yml's description fits the Marketplace limit
        run: |
          # Undocumented, found only by hitting it: the release-edit page's
          # "Publish this Action to the GitHub Marketplace" checkbox silently
          # fails to publish -- with no error surfaced anywhere this job would
          # see -- when `description` is 125 characters or longer. v0.1.2 and
          # v0.1.3 both shipped past this limit, so the Marketplace listing sat
          # frozen on stale text through two releases before anyone noticed.
          desc="$(awk '/^description:/{sub(/^description: /, ""); print; exit}' action.yml)"
          len="${#desc}"
          if [ "$len" -ge 125 ]; then
            echo "::error::action.yml description is ${len} characters (limit 125), so this release will silently fail to publish to the GitHub Marketplace: ${desc}"
            exit 1
          fi
      - name: Check both crates package cleanly against their published dependency versions
        run: cargo package --workspace --locked

  create-release:
    name: create release
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG already exists; assets will be added to it"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

  upload-assets:
    name: ${{ matrix.target }}
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl keeps the Linux binaries fully static: no glibc version to
          # match on the host that runs them.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            build-tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: bastyn
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: bastyn-$tag-$target
          include: README.md,LICENSE,NOTICE,CHANGELOG.md
          locked: true
          checksum: sha256
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          token: ${{ github.token }}

  # README tells people to use `BASTYN-labs/bastyn-scan@v0`, so something has to
  # keep that tag pointing at the newest v0.x.y. It runs last, and only after
  # every leg of upload-assets has succeeded: a release missing the Windows zip
  # is not a release the alias should be advertising.
  major-alias:
    name: move major alias tag
    needs: [upload-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Detached at the released commit, which is what the alias must point
          # at. persist-credentials defaults to true, so the checkout's
          # GITHUB_TOKEN is what authenticates the push below.
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Full history: pushing a tag out of a shallow clone is the kind of
          # thing that works until the one release where it does not.
          fetch-depth: 0
      - name: Move the major-version alias
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          # The push trigger's trailing `*` admits v0.2.0-rc.1, and moving v0
          # onto a release candidate would hand it to every user pinned at @v0
          # without them asking for it. Only an exact vMAJOR.MINOR.PATCH owns
          # the alias; anything with a suffix leaves it where it is.
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::$TAG is not a final release tag; leaving the major alias untouched"
            exit 0
          fi
          # Derived, not hardcoded, so v1.0.0 moves v1 without an edit here.
          major="v${BASH_REMATCH[1]}"

          # Belt and braces for the tag-shape check above: a release someone
          # flagged prerelease or left as a draft by hand should not be aliased
          # either, whatever its tag looks like.
          state="$(gh release view "$TAG" --json isDraft,isPrerelease \
            --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [ "$state" != "false false" ]; then
            echo "::notice::release $TAG is a draft or prerelease (isDraft/isPrerelease = $state); leaving $major untouched"
            exit 0
          fi

          sha="$(git rev-parse HEAD)"
          echo "moving $major to $sha ($TAG)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate "$major" "$sha" -m "Major-version alias, currently $TAG"
          git push --force origin "refs/tags/$major"

  release-gate:
    name: check final release tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      is-final-release: ${{ steps.check.outputs.is-final-release }}
    steps:
      - id: check
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-final-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is not a final release tag (vMAJOR.MINOR.PATCH, no suffix); crates.io and the Homebrew tap are only updated for final releases"
            echo "is-final-release=false" >> "$GITHUB_OUTPUT"
          fi

  publish-crates:
    name: publish to crates.io
    needs: [upload-assets, release-gate]
    if: needs.release-gate.outputs.is-final-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked

  # Split into two jobs so the GitHub App signing key in push-tap is never
  # present alongside a freshly-downloaded, freshly-executed release binary:
  # render-and-verify-tap has no secrets and is the job that runs
  # brew install/brew test against the real binary; push-tap has the key
  # and does nothing but download the already-verified artifact and push.
  # push-tap double-gates on release-gate explicitly (belt-and-braces)
  # rather than relying only on the implicit skip-propagation from its
  # needs: dependency, so a future refactor of push-tap's needs: list
  # can't silently remove the release-candidate guard.
  render-and-verify-tap:
    name: render and verify homebrew formula (${{ matrix.os }})
    needs: [upload-assets, release-gate]
    if: needs.release-gate.outputs.is-final-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Homebrew
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@2026.09.28.1
      - name: Download release checksum files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "bastyn-${TAG}-${target}.sha256" \
              --dir checksums
          done
      - name: Render the formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/render-homebrew-formula.sh "$TAG" checksums bastyn.rb
      - name: Set up a local tap for audit/install
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/bastyn-labs/homebrew-tap"
          mkdir -p "$tap_dir/Formula"
          cp bastyn.rb "$tap_dir/Formula/bastyn.rb"
          git -C "$tap_dir" init -q
          git -C "$tap_dir" -c user.email="ci@localhost" -c user.name="ci" add -A
          git -C "$tap_dir" -c user.email="ci@localhost" -c user.name="ci" commit -q -m "local tap for CI verification"
      - name: brew audit
        run: brew audit --strict --new bastyn-labs/tap/bastyn
      - name: brew install
        run: brew install bastyn-labs/tap/bastyn
      - name: brew test
        run: brew test bastyn
      - name: Upload the verified formula
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: bastyn-formula
          path: bastyn.rb
          retention-days: 1

  push-tap:
    name: push homebrew formula
    needs: [render-and-verify-tap, release-gate]
    if: needs.release-gate.outputs.is-final-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the verified formula
        uses: actions/download-artifact@v8
        with:
          name: bastyn-formula
      - name: Mint a homebrew-tap installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: BASTYN-labs
          repositories: homebrew-tap
      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: BASTYN-labs/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap
      - name: Push the updated formula
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp bastyn.rb homebrew-tap/Formula/bastyn.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bastyn.rb
          if git diff --cached --quiet; then
            echo "::notice::formula unchanged for $TAG; nothing to push"
            exit 0
          fi
          git commit -m "bastyn $TAG"
          git push
