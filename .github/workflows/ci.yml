name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Cargo passes `--cap-lints allow` to dependencies, so this denies warnings
  # in our code only.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test --workspace --all-features --locked
      # The distributed artifact is the release binary, so the release profile
      # (LTO, panic=abort, stripped) gets built and exercised, not just the
      # debug build the tests use.
      - run: cargo build --release --locked

      # The test-only endpoint override exists only in a build with the
      # `test-endpoint` feature. The shipped binary must not contain its names.
      - name: Release binary has no test-only reporting overrides
        shell: bash
        run: |
          bin=target/release/bastyn
          [ "$RUNNER_OS" = "Windows" ] && bin=target/release/bastyn.exe
          if grep -a -q -e BASTYN_REPORTING_ENDPOINT_FOR_TESTS -e BASTYN_REPORTING_TIMEOUT_MS_FOR_TESTS "$bin"; then
            echo "::error::the release binary contains test-only reporting variable names"
            exit 1
          fi

      # Scan our own fixtures with the real binary and assert the exit-code
      # contract. This is the end-to-end check the unit tests cannot make: the
      # shipped artifact, on this platform, against known-answer inputs.
      #
      # Note the repository root deliberately contains vulnerable fixture code,
      # so a bare `scan .` is expected to exit 1. That is the tool working.
      # The gate prints recall and precision against the corpus. Running it
      # with --nocapture puts those numbers in every CI log, so a regression is
      # visible in the run that caused it rather than only in a red test.
      - name: Corpus gate (precision and recall)
        run: cargo test -p bastyn-core --test corpus_gate --locked -- --nocapture

      - name: Self-scan (exit-code contract)
        shell: bash
        env:
          DO_NOT_TRACK: "1"
        run: |
          # `shell: bash` implies -e, which would abort on the first
          # deliberately non-zero exit before any assertion runs.
          set +e
          set -uo pipefail
          bin=target/release/bastyn

          "$bin" scan tests/fixtures/clean_agent --offline --quiet
          clean=$?
          "$bin" scan tests/fixtures/vulnerable_agent --offline --quiet
          vuln=$?
          "$bin" scan tests/fixtures/vulnerable_agent --offline --quiet --fail-on none
          nogate=$?
          "$bin" scan does-not-exist --offline --quiet 2>/dev/null
          missing=$?

          echo "clean=$clean vulnerable=$vuln fail-on-none=$nogate missing-path=$missing"

          fail=0
          [ "$clean"   -eq 0 ] || { echo "::error::clean fixture should exit 0, got $clean"; fail=1; }
          [ "$vuln"    -eq 1 ] || { echo "::error::vulnerable fixture should exit 1, got $vuln"; fail=1; }
          [ "$nogate"  -eq 0 ] || { echo "::error::--fail-on none should exit 0, got $nogate"; fail=1; }
          [ "$missing" -eq 2 ] || { echo "::error::missing path should exit 2, got $missing"; fail=1; }
          exit "$fail"

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    env:
      # Overrides `rust-toolchain.toml`, which pins stable for contributors.
      # Keep in sync with `rust-version` in Cargo.toml.
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo test --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  supply-chain:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check

  action-metadata:
    name: action.yml Marketplace limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check action.yml's description fits the Marketplace limit
        run: |
          # Undocumented, found only by hitting it: the release-edit page's
          # "Publish this Action to the GitHub Marketplace" checkbox silently
          # fails to publish -- with no error surfaced anywhere else -- when
          # `description` is 125 characters or longer. v0.1.2 and v0.1.3 both
          # shipped past this limit, so the Marketplace listing sat frozen on
          # stale text through two releases before anyone noticed. Caught here,
          # on every PR, rather than only at tag time in release.yml, where the
          # fix costs a whole extra release.
          desc="$(awk '/^description:/{sub(/^description: /, ""); print; exit}' action.yml)"
          len="${#desc}"
          if [ "$len" -ge 125 ]; then
            echo "::error::action.yml description is ${len} characters (limit 125), so a release will silently fail to publish to the GitHub Marketplace: ${desc}"
            exit 1
          fi

  test-install-script:
    name: test install.sh (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "alpine:latest"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install curl and tar (alpine)
        if: matrix.image == 'alpine:latest'
        run: apk add --no-cache curl tar
      - name: Install curl and tar (ubuntu)
        # The ubuntu:24.04 *container image* is a bare Debian-derived base
        # image, not the ubuntu-latest GitHub-hosted VM runner -- it does not
        # ship curl (or tar) by default.
        if: matrix.image == 'ubuntu:24.04'
        run: apt-get update && apt-get install -y --no-install-recommends curl tar ca-certificates
      - name: Run install.sh against the latest published release
        run: |
          set -eu
          BASTYN_INSTALL_DIR=/tmp/bastyn-test sh install.sh
          /tmp/bastyn-test/bastyn --version

  test-distribution-scripts:
    name: test distribution scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure dash is available
        run: which dash || sudo apt-get install -y dash
      - name: Test install.sh structural safety properties
        run: bash tests/install-sh/run.sh
      - name: Test Homebrew formula render script
        run: |
          set -euo pipefail
          bash scripts/render-homebrew-formula.sh v9.9.9 scripts/testdata/homebrew/checksums /tmp/rendered.rb
          diff /tmp/rendered.rb scripts/testdata/homebrew/expected.rb

  skills:
    name: validate agent skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate every skill against the Agent Skills specification
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/skills-venv"
          # Pinned: the validator is a reference implementation, so an
          # unpinned install could change what passes without a change here.
          "$RUNNER_TEMP/skills-venv/bin/pip" install --quiet skills-ref==0.1.1
          for skill in .agents/skills/*/; do
            "$RUNNER_TEMP/skills-venv/bin/agentskills" validate "$skill"
          done

  # Single required status check for branch protection: stays green only if
  # every job above succeeded, including every leg of the matrix.
  ci:
    name: ci
    if: always()
    needs: [fmt, clippy, test, msrv, docs, supply-chain, action-metadata, test-install-script, test-distribution-scripts, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          # Interpolated into the environment rather than the script, so job
          # names can never be injected into the shell.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if jq -e 'to_entries | any(.value.result != "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi
